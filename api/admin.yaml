openapi: 3.0.3
info:
  title: Zeus Admin API
  version: 0.1.0
  description: |
    管理员控制台（hwq830/zeusai-admin）与服务端 admin 进程之间的接口契约。服务端用 oapi-codegen
    生成接口层，控制台用 openapi-typescript 生成类型。

    约定：
    - 接口挂在 `/admin/v1` 下，由独立进程 `server/cmd/admin` 提供，只在内网 / VPN 暴露，不与 App 的 api 进程共用端口。
    - 鉴权：`Authorization: Bearer <token>`，令牌由 `POST /admin/v1/auth/login` 签发，12 小时有效，与 App 令牌密钥不同。
    - 角色：`owner` 全部权限（含管理员账号、推送活动审批）；`operator` 用户、额度、模板、连接器、任务、用户反馈、推送活动（编辑和提交）；
      `moderator` 内容审核、停用用户、用户反馈；`viewer` 只读。越权返回 403 `forbidden`。
    - 配置中心：`operator` 编辑配置项规则、提交发布、回滚；`owner` 另可新建 / 归档配置项、改命名空间、审批发布。
      生产环境（ZEUS_ENV=prod）提交后需 owner 审批，以下情况直接上线：只改动 killswitch 命名空间里已有的配置项；
      提交人是唯一的 owner。其他环境提交即上线。
    - 所有写操作记入审计日志（`GET /admin/v1/audit-log`）。
    - 金额单位为人民币元（`costCny`），由模型网关按每百万 token 单价计算。
    - 列表统一 `cursor` + `limit` 分页，响应带 `nextCursor`，为空表示没有更多。错误格式与 App 契约相同。
servers:
  - url: http://localhost:8081
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: dashboard
  - name: users
  - name: templates
  - name: connectors
  - name: moderation
  - name: tasks
  - name: costs
  - name: modelgw
  - name: providerKeys
  - name: analytics
  - name: admins
  - name: feedback
  - name: campaigns
  - name: config

paths:
  # ---------------------------------------------------------------- auth
  /admin/v1/auth/login:
    post:
      tags: [auth]
      operationId: adminLogin
      summary: 邮箱密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/me:
    get:
      tags: [auth]
      operationId: getAdminMe
      summary: 当前管理员
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/me/password:
    post:
      tags: [auth]
      operationId: changeAdminPassword
      summary: 修改自己的密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: 已修改 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- dashboard
  /admin/v1/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: 运营概览（按 Asia/Shanghai 计日）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- users
  /admin/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 用户列表
      parameters:
        - name: q
          in: query
          description: 用户 id、手机号片段或昵称
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
        - name: plan
          in: query
          schema: { type: string }
        - name: uiLanguage
          in: query
          description: 按 App 显示语言筛选
          schema: { type: string, enum: [zh, en] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      summary: 用户详情（额度、定时简报、近 30 天成本）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [users]
      operationId: updateUserPlan
      summary: 修改会员方案
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPlanPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}/token-grants:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: grantUserTokens
      summary: 给用户加赠本月 token（计入加赠当月，不结转）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaGrantInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}/quota:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      operationId: setUserQuota
      summary: 设置额度覆盖（字段为空表示沿用方案额度）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaOverrideInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [users]
      operationId: clearUserQuota
      summary: 清除额度覆盖
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}/disable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: disableUser
      summary: 停用账号（注销登录态，暂停其定时简报）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisableUserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}/enable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: enableUser
      summary: 恢复账号（恢复因停用而暂停的定时简报）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/plans:
    get:
      tags: [users]
      operationId: listPlans
      summary: 方案与额度（代码内配置，只读）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- templates
  /admin/v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: 模板列表；official 为官方模板，custom 为用户自定义模板（用于审核）
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [official, custom], default: official }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [templates]
      operationId: createTemplate
      summary: 新建官方模板
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTemplateInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTemplate' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [templates]
      operationId: getTemplate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTemplate' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [templates]
      operationId: updateTemplate
      summary: 修改模板。官方模板改过后不再被 `zeusctl seed` 覆盖；字段、栏目或来源变化时版本号加 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTemplateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTemplate' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [templates]
      operationId: deleteTemplate
      summary: 删除模板（已订阅的简报保留，但与模板解除关联；官方模板建议改为下架）
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- connectors
  /admin/v1/connectors:
    get:
      tags: [connectors]
      operationId: listConnectors
      summary: 内置工具与 MCP 白名单（含已下架）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminConnector' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/connectors/{connectorId}:
    parameters:
      - name: connectorId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [connectors]
      operationId: updateConnector
      summary: 上下架、默认开启、排序与展示文案。新增 MCP 服务需要改代码（catalog.yaml）后发布
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConnector' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- moderation
  /admin/v1/moderation/terms:
    get:
      tags: [moderation]
      operationId: listModerationTerms
      summary: 屏蔽词（与 ZEUS_MODERATION_KEYWORDS_FILE 合并生效，约 1 分钟内同步到各进程）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModerationTerm' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [moderation]
      operationId: createModerationTerm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationTermInput' }
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationTerm' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/moderation/terms/{termId}:
    parameters:
      - name: termId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [moderation]
      operationId: deleteModerationTerm
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/moderation/events:
    get:
      tags: [moderation]
      operationId: listModerationEvents
      summary: 拦截记录
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [input, output] }
        - name: userId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationEventPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/shares:
    get:
      tags: [moderation]
      operationId: listShares
      summary: 公开分享的报告和简报
      parameters:
        - name: active
          in: query
          description: 只看未撤销且未过期的
          schema: { type: boolean, default: true }
        - name: type
          in: query
          schema:
            type: string
            enum: [report, briefing]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharePage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/shares/{shareId}/revoke:
    parameters:
      - name: shareId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [moderation]
      operationId: revokeShare
      summary: 撤销分享链接
      responses:
        '204': { description: 已撤销 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [moderation]
      operationId: getReport
      summary: 查看报告正文（审核用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReport' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- tasks
  /admin/v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 全部任务
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
        - name: userId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: 任务详情与模型调用明细
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/tasks/{taskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: 取消运行中的任务
      responses:
        '202': { description: 已发出取消 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- costs
  /admin/v1/costs:
    get:
      tags: [costs]
      operationId: getCosts
      summary: 成本：按天、按模型、按任务类型、最高成本用户
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostReport' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- model gateway
  /admin/v1/modelgw:
    get:
      tags: [modelgw]
      operationId: getModelGateway
      summary: 模型网关路由与单价（读自 ZEUS_MODELGW_CONFIG，只读；修改需改文件并重启）及近 24 小时调用
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelGateway' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- analytics
  /admin/v1/analytics/overview:
    get:
      tags: [analytics]
      operationId: getAnalyticsOverview
      summary: 核心指标：门槛 B 三项、DAU/WAU/MAU（较前一周期）、待办、近 30 天活跃与新增、流失预警
      parameters:
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsOverview' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/growth:
    get:
      tags: [analytics]
      operationId: getAnalyticsGrowth
      summary: 用户增长：每日新增（按登录方式）和活跃、平台/版本/语言分布、激活漏斗
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsGrowth' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/retention:
    get:
      tags: [analytics]
      operationId: getAnalyticsRetention
      summary: 留存：按注册周的同期群（from/to 是注册日期范围，默认近 12 周）
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsRetention' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/engagement:
    get:
      tags: [analytics]
      operationId: getAnalyticsEngagement
      summary: 功能使用：简报、模板排行、报告、推送触达
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsEngagement' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/costs:
    get:
      tags: [analytics]
      operationId: getAnalyticsCosts
      summary: 成本与额度：总成本和每活跃用户成本、单次任务成本分布、本月额度用量
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsCosts' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/quality:
    get:
      tags: [analytics]
      operationId: getAnalyticsQuality
      summary: 任务质量：按类型的失败率和耗时、失败原因 Top 10
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsQuality' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- provider keys
  /admin/v1/provider-keys:
    get:
      tags: [providerKeys]
      operationId: listProviderKeys
      summary: 模型和搜索服务商的 API Key（只返回末 4 位）及每个服务商当前用的是哪把
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKeyList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [providerKeys]
      operationId: createProviderKey
      summary: 保存一把 Key（仅 owner）。activate 为 true 时同时设为该服务商的启用 Key，约 1 分钟内各进程生效
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderKeyInput' }
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKey' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/test:
    post:
      tags: [providerKeys]
      operationId: testNewProviderKey
      summary: 保存前测试一把 Key（仅 owner），模型发 1 个 token、搜索发一次查询
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, apiKey]
              properties:
                provider: { type: string }
                apiKey: { type: string }
      responses:
        '200':
          description: 测试结果（失败也返回 200，ok=false）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKeyTest' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    delete:
      tags: [providerKeys]
      operationId: deleteProviderKey
      summary: 删除（仅 owner，启用中的 Key 需先停用）
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/{keyId}/test:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      tags: [providerKeys]
      operationId: testProviderKey
      summary: 测试已保存的 Key（仅 owner），结果记在这把 Key 上
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKeyTest' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/{keyId}/activate:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      tags: [providerKeys]
      operationId: activateProviderKey
      summary: 设为该服务商的启用 Key（仅 owner），同服务商其他 Key 自动停用
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKey' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/{keyId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      tags: [providerKeys]
      operationId: deactivateProviderKey
      summary: 停用（仅 owner），该服务商回退到环境变量里的 Key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKey' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- admins
  /admin/v1/admins:
    get:
      tags: [admins]
      operationId: listAdmins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [admins]
      operationId: createAdmin
      summary: 新建管理员，返回一次性初始密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWithPassword' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/admins/{adminId}:
    parameters:
      - $ref: '#/components/parameters/AdminId'
    patch:
      tags: [admins]
      operationId: updateAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/admins/{adminId}/reset-password:
    parameters:
      - $ref: '#/components/parameters/AdminId'
    post:
      tags: [admins]
      operationId: resetAdminPassword
      summary: 重置密码，返回一次性新密码
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWithPassword' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/audit-log:
    get:
      tags: [admins]
      operationId: listAuditLog
      summary: 审计日志
      parameters:
        - name: targetType
          in: query
          schema: { type: string }
        - name: targetId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- feedback
  /admin/v1/feedback:
    get:
      tags: [feedback]
      operationId: listFeedback
      summary: 用户意见反馈
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FeedbackStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/FeedbackType' }
        - name: userId
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: 按内容搜索
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/feedback/{feedbackId}:
    parameters:
      - $ref: '#/components/parameters/FeedbackId'
    get:
      tags: [feedback]
      operationId: getFeedback
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackDetail' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [feedback]
      operationId: updateFeedback
      summary: 改状态、写内部备注（用户看不到备注）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/feedback/{feedbackId}/replies:
    parameters:
      - $ref: '#/components/parameters/FeedbackId'
    post:
      tags: [feedback]
      operationId: replyFeedback
      summary: 回复用户。用户在「我的反馈」里看到并收到推送（zeus://feedback/{id}）；待处理的反馈自动转为处理中
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackReplyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/report-feedback:
    get:
      tags: [feedback]
      operationId: listReportFeedback
      summary: 报告满意度评分，按最近评分排序
      parameters:
        - name: rating
          in: query
          schema: { type: string, enum: [satisfied, unsatisfied] }
        - name: reason
          in: query
          schema: { $ref: '#/components/schemas/ReportFeedbackReason' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportFeedbackPage' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- campaigns
  /admin/v1/campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: 运营推送活动，按创建时间倒序
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CampaignStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: 新建草稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/audience-estimate:
    post:
      tags: [campaigns]
      operationId: estimateCampaignAudience
      summary: 估算目标人数
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignAudience' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceEstimate' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: 详情和送达统计
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [campaigns]
      operationId: updateCampaign
      summary: 修改草稿（被驳回的活动回到草稿）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [campaigns]
      operationId: deleteCampaign
      summary: 删除草稿
      responses:
        '204': { description: OK }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/submit:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: submitCampaign
      summary: 提交审批（草稿 → 待审批）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/approve:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: approveCampaign
      summary: 审批通过（仅 owner）。没有定时则立即开始发送
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/reject:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: rejectCampaign
      summary: 驳回，回到草稿（仅 owner）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRejectRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/cancel:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: cancelCampaign
      summary: 取消待审批、已排期或发送中的活动；已写入的消息保留，可再撤回
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/recall:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: recallCampaign
      summary: 撤回：从所有用户的消息中心移除（已送达的推送无法撤回）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/test-send:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: testSendCampaign
      summary: 发测试推送到指定 App 用户的设备（标题加「[测试]」，不进消息中心，不受频控）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignTestRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignTestResult' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/keys:
    get:
      tags: [config]
      operationId: listConfigKeys
      summary: 配置项（工作副本），附线上版本的值
      parameters:
        - name: archived
          in: query
          description: true 时包含已归档的配置项
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigKeyList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [config]
      operationId: createConfigKey
      summary: 新建配置项（owner）。新建后要发布才会下发
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigKeyCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigKey' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/keys/{key}:
    parameters:
      - $ref: '#/components/parameters/ConfigKeyName'
    get:
      tags: [config]
      operationId: getConfigKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigKey' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [config]
      operationId: updateConfigKey
      summary: 修改工作副本。改命名空间、归档需要 owner；类型不能改
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigKeyPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigKey' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/changes:
    get:
      tags: [config]
      operationId: listConfigChanges
      summary: 工作副本相对线上版本的改动（发布前的 diff）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigChanges' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases:
    get:
      tags: [config]
      operationId: listConfigReleases
      summary: 发布记录，最新在前
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleasePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [config]
      operationId: submitConfigRelease
      summary: 提交发布。按审批规则直接上线（status=published）或等待审批（status=pending）
      description: 同一时间只有一个待审批的发布，新提交会把旧的待审批发布标为 superseded。没有改动时返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigReleaseRequest' }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags: [config]
      operationId: getConfigRelease
      summary: 发布详情。已发布的与上一个发布版本比较，待审批的与当前线上版本比较
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases/{releaseId}/approve:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [config]
      operationId: approveConfigRelease
      summary: 审批并上线（owner；不能审批自己提交的，除非只有一个 owner）
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigReleaseRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases/{releaseId}/reject:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [config]
      operationId: rejectConfigRelease
      summary: 驳回待审批的发布（owner）
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigReleaseRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases/{releaseId}/rollback:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [config]
      operationId: rollbackConfigRelease
      summary: 把这个已发布版本的内容作为新版本重新发布，同时把工作副本恢复成它（审批规则同提交）
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigReleaseRequest' }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/preview:
    post:
      tags: [config]
      operationId: previewConfig
      summary: 某个用户 / 设备会拿到什么值、命中哪条规则
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPreviewRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigPreview' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    AdminId:
      name: adminId
      in: path
      required: true
      schema: { type: string }
    AnalyticsFrom:
      name: from
      in: query
      description: 起始日（北京时间，含），默认近 30 天
      schema: { type: string, format: date }
    AnalyticsTo:
      name: to
      in: query
      description: 截止日（含），默认今天；范围最长 366 天
      schema: { type: string, format: date }
    AnalyticsPlatform:
      name: platform
      in: query
      description: 按用户最近使用的平台筛选，不传为全部
      schema: { type: string, enum: [ios, android] }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema: { type: string }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string }
    ConfigKeyName:
      name: key
      in: path
      required: true
      schema: { type: string, example: report.create_enabled }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ------------------------------------------------------------ common
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string, example: forbidden }
        message: { type: string }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: true
    NextCursor:
      type: string
      nullable: true
    Role:
      type: string
      enum: [owner, operator, moderator, viewer]

    # ------------------------------------------------------------ auth & admins
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token, expiresIn, admin]
      properties:
        token: { type: string }
        expiresIn: { type: integer, description: 秒 }
        admin: { $ref: '#/components/schemas/AdminUser' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 10 }
    AdminUser:
      type: object
      required: [id, email, name, role, disabled, permissions, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        permissions:
          type: array
          description: 该角色拥有的写权限，控制台据此显示按钮
          items: { type: string, example: users.write }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateAdminRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    AdminPatch:
      type: object
      properties:
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
    AdminWithPassword:
      type: object
      required: [admin, password]
      properties:
        admin: { $ref: '#/components/schemas/AdminUser' }
        password: { type: string, description: 只显示这一次 }
    AuditEntry:
      type: object
      required: [id, adminEmail, action, targetType, targetId, detail, createdAt]
      properties:
        id: { type: integer, format: int64 }
        adminEmail: { type: string }
        action: { type: string, example: user.disable }
        targetType: { type: string }
        targetId: { type: string }
        detail:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ dashboard
    Dashboard:
      type: object
      required: [users, activeUsers, tasksToday, reportsThisMonth, cost, daily, satisfaction]
      properties:
        users:
          type: object
          required: [total, newToday, new7d, disabled]
          properties:
            total: { type: integer }
            newToday: { type: integer }
            new7d: { type: integer }
            disabled: { type: integer }
        activeUsers:
          type: object
          required: [d1, d7, d30]
          description: 窗口内发起过任务（含定时简报）的用户数
          properties:
            d1: { type: integer }
            d7: { type: integer }
            d30: { type: integer }
        tasksToday:
          type: array
          items: { $ref: '#/components/schemas/TaskCount' }
        reportsThisMonth: { type: integer }
        cost:
          type: object
          required: [todayCny, last7dCny, last30dCny]
          properties:
            todayCny: { type: number, format: double }
            last7dCny: { type: number, format: double }
            last30dCny: { type: number, format: double }
            avgReportCostCny:
              type: number
              format: double
              nullable: true
              description: 近 30 天已完成报告的平均成本（门槛 B 要求 ≤ ¥3）
        daily:
          type: array
          description: 近 14 天
          items: { $ref: '#/components/schemas/DailyPoint' }
        satisfaction: { $ref: '#/components/schemas/Satisfaction' }
        shares: { $ref: '#/components/schemas/ShareStats' }
    ShareStats:
      type: object
      required: [createdToday, created7d, views7d, wechatViews7d, ctaClicks7d, channels7d]
      description: 近 7 天新建的分享链接及其累计访问 / 点击
      properties:
        createdToday: { type: integer }
        created7d: { type: integer }
        views7d: { type: integer }
        wechatViews7d: { type: integer }
        ctaClicks7d: { type: integer }
        briefingShareRate7d:
          type: number
          format: double
          nullable: true
          description: 被分享过的简报数 / 生成的简报数（近 7 天）
        channels7d:
          type: array
          items:
            type: object
            required: [channel, shares]
            properties:
              channel: { type: string }
              shares: { type: integer }
    TaskCount:
      type: object
      required: [kind, status, count]
      properties:
        kind: { type: string }
        status: { type: string }
        count: { type: integer }
    DailyPoint:
      type: object
      required: [date, newUsers, activeUsers, tasks, costCny]
      properties:
        date: { type: string, format: date }
        newUsers: { type: integer }
        activeUsers: { type: integer }
        tasks: { type: integer }
        costCny: { type: number, format: double }

    # ------------------------------------------------------------ users
    UserSummary:
      type: object
      required: [id, nickname, phoneMasked, loginMethods, planCode, timezone, uiLanguage, reportLanguage, disabled, createdAt]
      properties:
        id: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        loginMethods:
          type: array
          items: { type: string, enum: [phone, apple, wechat] }
        planCode: { type: string }
        planExpiresAt: { type: string, format: date-time, nullable: true }
        timezone: { type: string }
        uiLanguage: { type: string, enum: [zh, en], description: App 显示语言，简报和推送跟随它 }
        reportLanguage: { type: string, enum: [auto, zh, en], description: 报告生成语言，auto 跟随显示语言 }
        disabled: { type: boolean }
        disabledReason: { type: string }
        disabledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    QuotaItem:
      type: object
      required: [used, limit, planLimit]
      properties:
        used: { type: integer }
        limit: { type: integer, description: 生效额度（含覆盖） }
        planLimit: { type: integer, description: 方案额度 }
        resetsAt: { type: string, format: date-time, nullable: true }
    TokenQuotaItem:
      type: object
      description: 本月计费 token（各模型按 quota.token_weights 折算后的统一 token；失败任务不计入）
      required: [used, limit, planLimit, granted, resetsAt]
      properties:
        used: { type: integer, format: int64 }
        limit: { type: integer, format: int64, description: 生效额度（含覆盖与本月加赠） }
        planLimit: { type: integer, format: int64, description: 方案额度 }
        granted: { type: integer, format: int64, description: 本月加赠合计 }
        resetsAt: { type: string, format: date-time }
    QuotaGrant:
      type: object
      required: [id, tokens, reason, createdAt]
      properties:
        id: { type: integer, format: int64 }
        tokens: { type: integer, format: int64 }
        reason: { type: string }
        grantedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    QuotaGrantInput:
      type: object
      required: [tokens, reason]
      properties:
        tokens: { type: integer, format: int64, minimum: 1, maximum: 100000000 }
        reason: { type: string, minLength: 1, maxLength: 200, description: 原因，写入审计日志 }
    QuotaOverride:
      type: object
      required: [note, updatedAt]
      properties:
        subscriptions: { type: integer, nullable: true }
        tokensPerMonth: { type: integer, format: int64, nullable: true }
        note: { type: string }
        updatedAt: { type: string, format: date-time }
    SubscriptionSummary:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        templateId: { type: string, nullable: true }
        status: { type: string }
        pausedReason: { type: string, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    UserDetail:
      type: object
      required: [user, quota, subscriptions, cost30dCny, tasks30d]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        phone:
          type: string
          nullable: true
          description: 完整手机号，仅对有 users.write 权限的角色返回
        quota:
          type: object
          required: [subscriptions, tokens, grants]
          properties:
            subscriptions: { $ref: '#/components/schemas/QuotaItem' }
            tokens: { $ref: '#/components/schemas/TokenQuotaItem' }
            override: { $ref: '#/components/schemas/QuotaOverride' }
            grants:
              type: array
              description: 本月加赠记录，最近的在前
              items: { $ref: '#/components/schemas/QuotaGrant' }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionSummary' }
        cost30dCny: { type: number, format: double }
        tasks30d: { type: integer }
    UserPlanPatch:
      type: object
      required: [planCode]
      properties:
        planCode: { type: string, example: free }
        planExpiresAt: { type: string, format: date-time, nullable: true }
    QuotaOverrideInput:
      type: object
      required: [note]
      properties:
        subscriptions: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        tokensPerMonth: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 1000000000 }
        note: { type: string, maxLength: 200, description: 原因，写入审计日志 }
    DisableUserRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }
    Plan:
      type: object
      required: [code, subscriptions, tokensPerMonth]
      properties:
        code: { type: string }
        subscriptions: { type: integer }
        tokensPerMonth: { type: integer, format: int64 }

    # ------------------------------------------------------------ templates
    TemplateField:
      type: object
      required: [key, label, type, required]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, tags, number, select, multiselect] }
        required: { type: boolean }
        placeholder: { type: string }
        help: { type: string }
        options:
          type: array
          items: { type: string }
        max: { type: integer }
        min: { type: integer }
    TemplateSection:
      type: object
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
        instruction: { type: string }
        maxItems: { type: integer }
        private:
          type: boolean
          description: 本节含个人信息，用户分享简报时自动隐藏
    TemplateSource:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [search, site, rss, connector] }
        value: { type: string }
        label: { type: string }
    Schedule:
      type: object
      required: [freq, time, tz]
      properties:
        freq: { type: string, enum: [daily, weekly, monthly] }
        weekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        monthDay: { type: integer, minimum: 1, maximum: 28 }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        tz: { type: string }
    AdminTemplateInput:
      type: object
      required: [name, fields, sections, published, sortOrder]
      properties:
        name: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 200 }
        category: { type: string }
        icon: { type: string, description: SF Symbol 名 }
        fields:
          type: array
          items: { $ref: '#/components/schemas/TemplateField' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/TemplateSection' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/TemplateSource' }
        defaultSchedule: { $ref: '#/components/schemas/Schedule' }
        defaultLength: { type: string, enum: [short, standard, long] }
        requiredConnectors:
          type: array
          items: { type: string }
        published: { type: boolean, description: 官方模板是否在 App 模板库展示 }
        sortOrder: { type: integer }
        slug:
          type: string
          description: 仅新建时有效；留空则不与 prompts/briefing-templates 关联
        translations:
          type: object
          description: 其他语言的文案，键为语言（目前只有 en）；缺的字段回落中文
          additionalProperties: { $ref: '#/components/schemas/TemplateTranslation' }
    TemplateTranslation:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        category: { type: string }
        fields:
          type: object
          description: 键为字段 key
          additionalProperties:
            type: object
            properties:
              label: { type: string }
              placeholder: { type: string }
              help: { type: string }
              options:
                type: array
                description: 与中文选项一一对应，个数不同时不生效
                items: { type: string }
        sections:
          type: object
          description: 键为栏目 key
          additionalProperties:
            type: object
            properties:
              title: { type: string }
              instruction: { type: string }
    AdminTemplate:
      allOf:
        - $ref: '#/components/schemas/AdminTemplateInput'
        - type: object
          required: [id, kind, version, adminManaged, subscriptionCount, createdAt, updatedAt]
          properties:
            id: { type: string }
            kind: { type: string, enum: [official, custom] }
            ownerId: { type: string, nullable: true }
            version: { type: integer }
            adminManaged: { type: boolean, description: 在控制台改过，seed 不再覆盖 }
            subscriptionCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    TemplatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminTemplate' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ connectors
    ConnectorTool:
      type: object
      required: [name, write]
      properties:
        name: { type: string }
        description: { type: string }
        write: { type: boolean }
    AdminConnector:
      type: object
      required: [id, name, description, kind, category, transport, requiresAuth, defaultOn, available, sortOrder, tools, adminManaged, enabledUsers, authorizedUsers]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        iconUrl: { type: string }
        kind: { type: string }
        category: { type: string }
        transport: { type: string, description: builtin / http }
        mcpVersion: { type: string }
        requiresAuth: { type: boolean }
        defaultOn: { type: boolean }
        available: { type: boolean, description: false 为下架，App 不再展示 }
        sortOrder: { type: integer }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ConnectorTool' }
        adminManaged: { type: boolean }
        enabledUsers: { type: integer, description: 主动开启的用户数 }
        authorizedUsers: { type: integer }
    ConnectorPatch:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        available: { type: boolean }
        defaultOn: { type: boolean }
        sortOrder: { type: integer }

    # ------------------------------------------------------------ moderation
    ModerationTerm:
      type: object
      required: [id, term, note, createdAt]
      properties:
        id: { type: integer, format: int64 }
        term: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    ModerationTermInput:
      type: object
      required: [term]
      properties:
        term: { type: string, minLength: 1, maxLength: 50 }
        note: { type: string, maxLength: 200 }
    ModerationEvent:
      type: object
      required: [id, kind, reason, excerpt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: string, nullable: true }
        nickname: { type: string }
        phoneMasked: { type: string }
        kind: { type: string, enum: [input, output] }
        reason: { type: string }
        excerpt: { type: string, description: 被拦截文本的前 200 字 }
        createdAt: { type: string, format: date-time }
    ModerationEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ModerationEvent' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    AdminShare:
      type: object
      required: [id, targetType, targetId, title, userId, nickname, phoneMasked, scope, channel, viewCount, wechatViewCount, ctaClicks, createdAt]
      properties:
        id: { type: string }
        targetType:
          type: string
          enum: [report, briefing]
        targetId:
          type: string
          description: 报告或简报 id
        itemId:
          type: string
          description: 单条分享时的条目 id
        title: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        scope:
          type: string
          description: full / summary / item
        channel:
          type: string
          description: 首次分享渠道，空表示旧版 App 或未上报
        viewCount:
          type: integer
          description: 访问人数（同一访客每天计一次）
        wechatViewCount: { type: integer }
        ctaClicks:
          type: integer
          description: 分享页"生成我的"按钮点击数
        url: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    SharePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminShare' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    AdminReport:
      type: object
      required: [id, userId, title, topic, status, summary, markdown, sourceCount, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        title: { type: string }
        topic: { type: string }
        status: { type: string }
        summary: { type: string }
        markdown: { type: string }
        sourceCount: { type: integer }
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------------ tasks
    AdminTask:
      type: object
      required: [id, userId, nickname, phoneMasked, kind, status, title, costCny, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        kind: { type: string }
        status: { type: string }
        title: { type: string }
        subtitle: { type: string }
        promptVersion: { type: string }
        reportId: { type: string, nullable: true }
        briefingId: { type: string, nullable: true }
        error:
          type: object
          nullable: true
          additionalProperties: true
        costCny: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    TaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminTask' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    ModelCall:
      type: object
      required: [provider, model, tier, inputTokens, outputTokens, cachedTokens, costCny, createdAt]
      properties:
        provider: { type: string }
        model: { type: string }
        tier: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cachedTokens: { type: integer }
        costCny: { type: number, format: double }
        createdAt: { type: string, format: date-time }
    TaskDetail:
      type: object
      required: [task, input, calls]
      properties:
        task: { $ref: '#/components/schemas/AdminTask' }
        input:
          type: object
          additionalProperties: true
        plan:
          type: object
          nullable: true
          additionalProperties: true
        calls:
          type: array
          items: { $ref: '#/components/schemas/ModelCall' }

    # ------------------------------------------------------------ costs
    CostReport:
      type: object
      required: [days, totalCny, daily, byModel, byKind, topUsers, tokenQuota]
      properties:
        days: { type: integer }
        totalCny: { type: number, format: double }
        daily:
          type: array
          items:
            type: object
            required: [date, costCny, inputTokens, outputTokens, calls]
            properties:
              date: { type: string, format: date }
              costCny: { type: number, format: double }
              inputTokens: { type: integer, format: int64 }
              outputTokens: { type: integer, format: int64 }
              calls: { type: integer }
        byModel:
          type: array
          items:
            type: object
            required: [provider, model, tier, calls, inputTokens, outputTokens, costCny, billedTokens]
            properties:
              provider: { type: string }
              model: { type: string }
              tier: { type: string }
              calls: { type: integer }
              inputTokens: { type: integer, format: int64 }
              outputTokens: { type: integer, format: int64 }
              costCny: { type: number, format: double }
              billedTokens: { type: integer, format: int64, description: 按折算系数扣给用户的 token }
              cnyPerMillionBilled:
                type: number
                format: double
                nullable: true
                description: 每百万计费 token 的实际成本；各模型差距大说明折算系数需要调整
        tokenQuota:
          type: object
          description: 本自然月（Asia/Shanghai）免费 token 额度的使用分布，按方案额度计算，不含用户级覆盖与加赠
          required: [periodStart, planLimit, activeUsers, avgTokens, atLimitUsers, buckets]
          properties:
            periodStart: { type: string, format: date }
            planLimit: { type: integer, format: int64 }
            activeUsers: { type: integer, description: 本月有消耗的用户数 }
            avgTokens: { type: integer, format: int64 }
            atLimitUsers: { type: integer, description: 已用满额度的用户数 }
            buckets:
              type: array
              items:
                type: object
                required: [label, users]
                properties:
                  label: { type: string, example: 20–40% }
                  users: { type: integer }
        byKind:
          type: array
          description: 已完成任务按类型的总成本与平均成本
          items:
            type: object
            required: [kind, tasks, costCny, avgCostCny]
            properties:
              kind: { type: string }
              tasks: { type: integer }
              costCny: { type: number, format: double }
              avgCostCny: { type: number, format: double }
        topUsers:
          type: array
          items:
            type: object
            required: [userId, nickname, phoneMasked, tasks, costCny]
            properties:
              userId: { type: string }
              nickname: { type: string }
              phoneMasked: { type: string }
              tasks: { type: integer }
              costCny: { type: number, format: double }

    # ------------------------------------------------------------ model gateway
    ModelGateway:
      type: object
      required: [llmProvider, configured, providers, routes, usage24h]
      properties:
        llmProvider: { type: string, description: 'mock 或 gateway（ZEUS_LLM_PROVIDER）' }
        configured: { type: boolean, description: 是否读到了路由文件 }
        configError: { type: string }
        breakerFailures: { type: integer }
        breakerCooldown: { type: string, example: 30s }
        routes:
          type: object
          description: tier → 按顺序尝试的服务商
          additionalProperties:
            type: array
            items: { type: string }
        providers:
          type: array
          items:
            type: object
            required: [name, baseUrl, apiKeyEnv, keyPresent, models, prices]
            properties:
              name: { type: string }
              baseUrl: { type: string }
              apiKeyEnv: { type: string }
              keyPresent: { type: boolean, description: 是否有可用的 key（后台启用的 Key 或环境变量，不返回 key 本身） }
              keySource:
                type: string
                enum: [console, env, none]
                description: console = 后台「API Key」页启用的 Key；env = 环境变量
              timeout: { type: string }
              models:
                type: object
                additionalProperties: { type: string }
              prices:
                type: array
                items:
                  type: object
                  required: [model, input, output, cached]
                  properties:
                    model: { type: string }
                    input: { type: number, format: double, description: 元 / 百万 token }
                    output: { type: number, format: double }
                    cached: { type: number, format: double }
        usage24h:
          type: array
          items:
            type: object
            required: [provider, calls, costCny]
            properties:
              provider: { type: string }
              calls: { type: integer }
              costCny: { type: number, format: double }
              lastCallAt: { type: string, format: date-time, nullable: true }

    # ------------------------------------------------------------ analytics
    # 口径：按北京时间计日；活跃 = 当天打开过 App（带登录态调用过接口），定时简报不算。
    # 2026-10-30 之前的活跃数据由注册日、用户主动发起任务的日子和最后在线日近似回填。
    Kpi:
      type: object
      required: [value]
      properties:
        value: { type: number, format: double }
        previous: { type: number, format: double, nullable: true, description: 上一周期（日指标为昨天，周/月指标为前一个 7/30 天） }
    KeyCount:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }
    RetentionCell:
      type: object
      required: [eligible, retained]
      properties:
        eligible: { type: integer, description: 这一天已经过完的用户数 }
        retained: { type: integer }
    AtRisk:
      type: object
      description: 有定时简报在跑、但近 7 天没打开 App 的用户，以及这 7 天花在他们身上的简报和成本
      required: [users, briefings, costCny]
      properties:
        users: { type: integer }
        briefings: { type: integer }
        costCny: { type: number, format: double }
    AnalyticsOverview:
      type: object
      required: [gateB, kpis, todo, daily, atRisk]
      properties:
        gateB:
          type: object
          required: [d30Retention, reportSatisfaction, reportCost]
          properties:
            d30Retention:
              type: object
              description: 注册后第 29–31 天打开过 App 的比例，取注册日在 31–60 天前的用户（目标 ≥ 20%）
              required: [eligible, retained, cohortFrom, cohortTo, weekly]
              properties:
                rate: { type: number, format: double, nullable: true }
                eligible: { type: integer }
                retained: { type: integer }
                cohortFrom: { type: string, format: date }
                cohortTo: { type: string, format: date }
                weekly:
                  type: array
                  description: 按注册周，最近 8 个已能观察到第 31 天的周
                  items:
                    type: object
                    required: [week, eligible, retained]
                    properties:
                      week: { type: string, format: date }
                      rate: { type: number, format: double, nullable: true }
                      eligible: { type: integer }
                      retained: { type: integer }
            reportSatisfaction:
              type: object
              description: 近 30 天创建的报告（目标 ≥ 70%，评分率 < 25% 时无效）
              required: [satisfied, unsatisfied, completed, weekly]
              properties:
                rate: { type: number, format: double, nullable: true }
                ratingRate: { type: number, format: double, nullable: true }
                satisfied: { type: integer }
                unsatisfied: { type: integer }
                completed: { type: integer }
                weekly:
                  type: array
                  items:
                    type: object
                    required: [week, satisfied, unsatisfied, completed]
                    properties:
                      week: { type: string, format: date }
                      rate: { type: number, format: double, nullable: true }
                      satisfied: { type: integer }
                      unsatisfied: { type: integer }
                      completed: { type: integer }
            reportCost:
              type: object
              description: 近 30 天完成的报告任务的模型成本（目标 ≤ ¥3）
              required: [reports, weekly]
              properties:
                avgCny: { type: number, format: double, nullable: true }
                p90Cny: { type: number, format: double, nullable: true }
                reports: { type: integer }
                weekly:
                  type: array
                  items:
                    type: object
                    required: [week, reports]
                    properties:
                      week: { type: string, format: date }
                      avgCny: { type: number, format: double, nullable: true }
                      reports: { type: integer }
        kpis:
          type: object
          required: [dau, wau, mau, stickiness, newUsers, briefingsRead, reports]
          properties:
            dau: { $ref: '#/components/schemas/Kpi' }
            wau: { $ref: '#/components/schemas/Kpi' }
            mau: { $ref: '#/components/schemas/Kpi' }
            stickiness: { $ref: '#/components/schemas/Kpi' }
            newUsers: { $ref: '#/components/schemas/Kpi' }
            briefingsRead: { $ref: '#/components/schemas/Kpi' }
            reports: { $ref: '#/components/schemas/Kpi' }
        todo:
          type: object
          required: [openFeedback, pendingCampaigns, pendingReleases, failedTasks24h]
          properties:
            openFeedback: { type: integer }
            pendingCampaigns: { type: integer }
            pendingReleases: { type: integer }
            failedTasks24h: { type: integer }
        daily:
          type: array
          description: 近 30 天
          items:
            type: object
            required: [date, activeUsers, newUsers]
            properties:
              date: { type: string, format: date }
              activeUsers: { type: integer }
              newUsers: { type: integer }
        atRisk: { $ref: '#/components/schemas/AtRisk' }
    GrowthSummary:
      type: object
      required: [newUsers, activeUsers, avgDailyActive]
      properties:
        newUsers: { type: integer }
        activeUsers: { type: integer, description: 范围内打开过 App 的去重用户 }
        avgDailyActive: { type: number, format: double }
    AnalyticsGrowth:
      type: object
      required: [from, to, current, previous, daily, platforms, versions, languages, funnel]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        current: { $ref: '#/components/schemas/GrowthSummary' }
        previous: { $ref: '#/components/schemas/GrowthSummary' }
        daily:
          type: array
          items:
            type: object
            required: [date, activeUsers, newUsers, newPhone, newApple, newWechat, newOther, totalUsers]
            properties:
              date: { type: string, format: date }
              activeUsers: { type: integer }
              newUsers: { type: integer }
              newPhone: { type: integer }
              newApple: { type: integer }
              newWechat: { type: integer }
              newOther: { type: integer }
              totalUsers: { type: integer }
        platforms: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        versions: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        languages: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        funnel:
          type: object
          description: 范围内注册的用户；第二周活跃 = 注册后第 7–13 天打开过 App，只算第 13 天已过完的用户
          required: [registered, subscribed, readBriefing, startedReport, week2Eligible, week2Active]
          properties:
            registered: { type: integer }
            subscribed: { type: integer }
            readBriefing: { type: integer }
            startedReport: { type: integer }
            week2Eligible: { type: integer }
            week2Active: { type: integer }
    AnalyticsRetention:
      type: object
      required: [from, to, cohorts, atRisk]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        cohorts:
          type: array
          items:
            type: object
            required: [week, users, d1, d3, d7, d14, d30]
            properties:
              week: { type: string, format: date, description: 注册周的周一 }
              users: { type: integer }
              d1: { $ref: '#/components/schemas/RetentionCell' }
              d3: { $ref: '#/components/schemas/RetentionCell' }
              d7: { $ref: '#/components/schemas/RetentionCell' }
              d14: { $ref: '#/components/schemas/RetentionCell' }
              d30: { $ref: '#/components/schemas/RetentionCell' }
        atRisk: { $ref: '#/components/schemas/AtRisk' }
    BriefingStats:
      type: object
      required: [activeSubscriptions, pausedSubscriptions, newSubscriptions, generated, ready, failed, read, medianReadDelayMinutes, useful, meh, shared]
      properties:
        activeSubscriptions: { type: integer, description: 当前数，不随范围变化 }
        pausedSubscriptions: { type: integer }
        newSubscriptions: { type: integer }
        generated: { type: integer }
        ready: { type: integer }
        failed: { type: integer }
        read: { type: integer }
        medianReadDelayMinutes: { type: number, format: double }
        useful: { type: integer }
        meh: { type: integer }
        shared: { type: integer }
    ReportStats:
      type: object
      required: [started, completed, failed, cancelled, avgDurationSeconds, avgSources, followups, reportsWithFollowup, pdfExports, shared, satisfied, unsatisfied]
      properties:
        started: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        avgDurationSeconds: { type: number, format: double }
        avgSources: { type: number, format: double }
        followups: { type: integer }
        reportsWithFollowup: { type: integer }
        pdfExports: { type: integer }
        shared: { type: integer }
        satisfied: { type: integer }
        unsatisfied: { type: integer }
    AnalyticsEngagement:
      type: object
      required: [from, to, briefings, previousBriefings, briefingsDaily, templates, reports, previousReports, reportsDaily, depths, unsatisfiedReasons, push]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        briefings: { $ref: '#/components/schemas/BriefingStats' }
        previousBriefings: { $ref: '#/components/schemas/BriefingStats' }
        briefingsDaily:
          type: array
          items:
            type: object
            required: [date, generated, read]
            properties:
              date: { type: string, format: date }
              generated: { type: integer }
              read: { type: integer }
        templates:
          type: array
          description: 官方模板，按当前订阅数排序
          items:
            type: object
            required: [id, name, activeSubscriptions, newSubscriptions, briefings, read, useful, meh]
            properties:
              id: { type: string }
              name: { type: string }
              activeSubscriptions: { type: integer }
              newSubscriptions: { type: integer }
              briefings: { type: integer }
              read: { type: integer }
              useful: { type: integer }
              meh: { type: integer }
        reports: { $ref: '#/components/schemas/ReportStats' }
        previousReports: { $ref: '#/components/schemas/ReportStats' }
        reportsDaily:
          type: array
          items:
            type: object
            required: [date, started, completed]
            properties:
              date: { type: string, format: date }
              started: { type: integer }
              completed: { type: integer }
        depths: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        unsatisfiedReasons: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        push:
          type: object
          required: [activeUsers, withDevice, briefingPushOn, marketingOptIn, messages, pushed, opened, categories]
          properties:
            activeUsers: { type: integer }
            withDevice: { type: integer, description: 活跃用户中登记了推送设备的 }
            briefingPushOn: { type: integer, description: 其中简报通知开着的 }
            marketingOptIn: { type: integer }
            messages: { type: integer, description: 这些用户在范围内收到的站内消息 }
            pushed: { type: integer }
            opened: { type: integer }
            categories:
              type: array
              items:
                type: object
                required: [category, messages, pushed, opened, read]
                properties:
                  category: { type: string }
                  messages: { type: integer }
                  pushed: { type: integer }
                  opened: { type: integer }
                  read: { type: integer }
    CostSummary:
      type: object
      required: [costCny, billedTokens, activeUsers]
      properties:
        costCny: { type: number, format: double }
        billedTokens: { type: integer, format: int64 }
        activeUsers: { type: integer }
        costPerActiveUserCny: { type: number, format: double, nullable: true }
    AnalyticsCosts:
      type: object
      required: [from, to, current, previous, unitCosts, quota]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        current: { $ref: '#/components/schemas/CostSummary' }
        previous: { $ref: '#/components/schemas/CostSummary' }
        unitCosts:
          type: array
          description: 范围内完成的任务，按类型的单次模型成本
          items:
            type: object
            required: [kind, tasks, costCny, medianCny, p90Cny]
            properties:
              kind: { type: string }
              tasks: { type: integer }
              costCny: { type: number, format: double }
              medianCny: { type: number, format: double }
              p90Cny: { type: number, format: double }
        quota:
          type: object
          description: 本月（北京时间自然月）有用量的用户，用到额度的比例；额度 = 用户覆盖值或默认值 + 本月加赠
          required: [monthStart, defaultLimit, users, over50, over80, exhausted, medianUsed, grantedTokens, grantedUsers]
          properties:
            monthStart: { type: string, format: date }
            defaultLimit: { type: integer, format: int64 }
            users: { type: integer }
            over50: { type: integer }
            over80: { type: integer }
            exhausted: { type: integer }
            medianUsed: { type: number, format: double }
            grantedTokens: { type: integer, format: int64 }
            grantedUsers: { type: integer }
    AnalyticsQuality:
      type: object
      required: [from, to, kinds, errors]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        kinds:
          type: array
          items:
            type: object
            required: [kind, total, done, failed, cancelled, p50Seconds, p90Seconds]
            properties:
              kind: { type: string }
              total: { type: integer }
              done: { type: integer }
              failed: { type: integer }
              cancelled: { type: integer }
              p50Seconds: { type: number, format: double }
              p90Seconds: { type: number, format: double }
        errors:
          type: array
          items:
            type: object
            required: [kind, code, message, count]
            properties:
              kind: { type: string }
              code: { type: string }
              message: { type: string }
              count: { type: integer }

    # ------------------------------------------------------------ provider keys
    ProviderKeyList:
      type: object
      required: [encryptionEnabled, providers, keys]
      properties:
        encryptionEnabled:
          type: boolean
          description: 服务端配置了 ZEUS_SECRETS_KEY；为 false 时不能在后台保存 Key
        providers:
          type: array
          items: { $ref: '#/components/schemas/KeyProvider' }
        keys:
          type: array
          items: { $ref: '#/components/schemas/ProviderKey' }
    KeyProvider:
      type: object
      required: [id, name, kind, apiKeyEnv, envKeyPresent, keySource, inRoute]
      properties:
        id: { type: string, example: qwen }
        name: { type: string, example: 通义千问 }
        kind: { type: string, enum: [llm, search] }
        baseUrl: { type: string }
        apiKeyEnv: { type: string, description: 回退用的环境变量名 }
        envKeyPresent: { type: boolean }
        keySource:
          type: string
          enum: [console, env, none]
        inRoute: { type: boolean, description: 当前是否在用（模型：在网关路由里且 ZEUS_LLM_PROVIDER=gateway；搜索：ZEUS_SEARCH_PROVIDER=bocha） }
    ProviderKey:
      type: object
      required: [id, provider, label, last4, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        label: { type: string }
        last4: { type: string, description: Key 末 4 位，明文不返回 }
        active: { type: boolean }
        createdBy: { type: string, description: 创建人邮箱 }
        createdAt: { type: string, format: date-time }
        lastTestedAt: { type: string, format: date-time, nullable: true }
        lastTestOk: { type: boolean, nullable: true }
        lastTestMessage: { type: string }
        lastTestLatencyMs: { type: integer, nullable: true }
    ProviderKeyInput:
      type: object
      required: [provider, apiKey]
      properties:
        provider: { type: string }
        label: { type: string, maxLength: 50 }
        apiKey: { type: string, minLength: 8, maxLength: 512 }
        activate: { type: boolean, default: true }
    ProviderKeyTest:
      type: object
      required: [ok, message, latencyMs]
      properties:
        ok: { type: boolean }
        message: { type: string }
        latencyMs: { type: integer }

    # ------------------------------------------------------------ feedback
    Satisfaction:
      type: object
      description: |
        报告满意度 = satisfied ÷ (satisfied + unsatisfied)，按报告创建日落窗口；评分率 = 已评 ÷ completed。
        门槛 B 要求满意度 ≥ 70%，评分率低于 25% 时结论无效。
      required: [reports7d, reports30d, briefings30d, openFeedback, unsatisfiedReasons30d]
      properties:
        reports7d: { $ref: '#/components/schemas/ReportRatingCounts' }
        reports30d: { $ref: '#/components/schemas/ReportRatingCounts' }
        briefings30d:
          type: object
          description: 简报整期评分（不含单条）
          required: [useful, meh]
          properties:
            useful: { type: integer }
            meh: { type: integer }
        openFeedback:
          type: integer
          description: 待处理 + 处理中的意见反馈
        unsatisfiedReasons30d:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { $ref: '#/components/schemas/ReportFeedbackReason' }
              count: { type: integer }
    ReportRatingCounts:
      type: object
      required: [completed, satisfied, unsatisfied]
      properties:
        completed: { type: integer, description: 窗口内创建且已完成的报告数 }
        satisfied: { type: integer }
        unsatisfied: { type: integer }
    FeedbackType:
      type: string
      enum: [bug, suggestion, other]
    FeedbackStatus:
      type: string
      enum: [new, in_progress, resolved, closed]
    ReportFeedbackReason:
      type: string
      description: 内容不准确 / 不够深入 / 来源不可靠 / 没回答我的问题 / 生成太慢 / 其他
      enum: [inaccurate, shallow, bad_sources, off_topic, slow, other]
    FeedbackSummary:
      type: object
      required: [id, userId, nickname, phoneMasked, type, content, status, flagged, attachmentCount, replyCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        type: { $ref: '#/components/schemas/FeedbackType' }
        content: { type: string }
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        flagged:
          type: boolean
          description: 命中审核关键词（仅标记，不拦截）
        appVersion: { type: string }
        attachmentCount: { type: integer }
        replyCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedbackSummary' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    FeedbackDetail:
      allOf:
        - $ref: '#/components/schemas/FeedbackSummary'
        - type: object
          required: [contact, client, flaggedReason, adminNote, attachments, replies]
          properties:
            contact: { type: string }
            client:
              type: object
              description: App 版本、系统、机型等，原样保存
              additionalProperties: true
            reportId: { type: string, nullable: true }
            taskId: { type: string, nullable: true }
            flaggedReason: { type: string }
            adminNote: { type: string }
            handledBy: { type: string, nullable: true, description: 最后处理人邮箱 }
            lastReplyAt: { type: string, format: date-time, nullable: true }
            userReadAt:
              type: string
              format: date-time
              nullable: true
              description: 用户最后一次打开这条反馈的时间
            attachments:
              type: array
              items:
                type: object
                required: [id, url]
                properties:
                  id: { type: string }
                  url: { type: string, description: 短时签名链接 }
            replies:
              type: array
              items:
                type: object
                required: [id, content, createdAt]
                properties:
                  id: { type: string }
                  content: { type: string }
                  adminName: { type: string }
                  createdAt: { type: string, format: date-time }
    FeedbackPatch:
      type: object
      properties:
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        adminNote: { type: string, maxLength: 2000 }
    FeedbackReplyRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 1000 }
    ReportFeedbackItem:
      type: object
      required: [reportId, reportTitle, reportDepth, userId, nickname, phoneMasked, rating, reasons, comment, reportCreatedAt, updatedAt]
      properties:
        reportId: { type: string }
        reportTitle: { type: string }
        reportDepth: { type: string }
        taskId: { type: string, nullable: true }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        rating: { type: string, enum: [satisfied, unsatisfied] }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/ReportFeedbackReason' }
        comment: { type: string }
        reportCreatedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReportFeedbackPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportFeedbackItem' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ campaigns
    CampaignStatus:
      type: string
      description: draft 草稿 → pending_approval 待审批 → scheduled 已排期 → sending 发送中 → sent 已发送；cancelled 已取消、recalled 已撤回
      enum: [draft, pending_approval, scheduled, sending, sent, cancelled, recalled]
    CampaignCategory:
      type: string
      description: marketing 运营活动（只推给开启了运营推送的用户，受频控）；service 服务通知（如停机公告）
      enum: [marketing, service]
    CampaignAudience:
      type: object
      required: [type]
      description: |
        all 全部用户；users 指定 userIds（最多 10000）；filter 按条件，所有已填条件同时满足。停用的用户始终排除。
      properties:
        type: { type: string, enum: [all, users, filter] }
        userIds:
          type: array
          items: { type: string }
        registeredAfter: { type: string, format: date-time }
        registeredBefore: { type: string, format: date-time }
        activeWithinDays: { type: integer, minimum: 0, maximum: 365, description: 最近 N 天打开过 App }
        inactiveForDays: { type: integer, minimum: 0, maximum: 365, description: 超过 N 天没打开 App }
        minAppVersion: { type: string, example: '1.2.0' }
        templateId: { type: string, description: 有用该模板创建的进行中简报订阅 }
        language: { type: string, enum: [zh, en], description: App 显示语言；不填表示不限 }
        platform:
          type: string
          enum: [ios, android]
          description: 有该平台的推送设备；和 minAppVersion 同时填时，版本按该平台的设备比较。不填表示不限
    CampaignInput:
      type: object
      required: [name, category, title, body, audience]
      properties:
        name: { type: string, description: 内部名称，用户看不到 }
        category: { $ref: '#/components/schemas/CampaignCategory' }
        title: { type: string, maxLength: 40 }
        body: { type: string, maxLength: 200 }
        titleEn: { type: string, maxLength: 80, description: 英文标题，选填；显示语言为英文的用户收到英文，未填则收中文 }
        bodyEn: { type: string, maxLength: 400 }
        imageUrl: { type: string, description: https 图片，推送大图和消息中心都会显示 }
        deeplink: { type: string, description: 'zeus:// 页面或 https 链接，空表示只打开 App' }
        audience: { $ref: '#/components/schemas/CampaignAudience' }
        sendAt: { type: string, format: date-time, nullable: true, description: 定时发送；为空表示审批通过后立即发送 }
    CampaignStats:
      type: object
      required: [messages, pushed, pushFailed, pushSkipped, pushPending, read, opened]
      properties:
        messages: { type: integer, description: 写入消息中心的人数 }
        pushed: { type: integer, description: APNs 推送成功 }
        pushFailed: { type: integer }
        pushSkipped: { type: integer, description: 用户关闭、频控或没有设备 }
        pushPending: { type: integer, description: 免打扰延后中 }
        read: { type: integer, description: 在消息中心或通过推送看过 }
        opened: { type: integer, description: 点推送打开 App }
    Campaign:
      type: object
      required: [id, name, category, title, body, imageUrl, deeplink, audience, status, audienceEstimate, rejectReason, stats, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/CampaignCategory' }
        title: { type: string }
        body: { type: string }
        titleEn: { type: string }
        bodyEn: { type: string }
        imageUrl: { type: string }
        deeplink: { type: string }
        audience: { $ref: '#/components/schemas/CampaignAudience' }
        sendAt: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        audienceEstimate: { type: integer, description: 提交时估算的目标人数 }
        rejectReason: { type: string }
        createdBy: { type: string, description: 创建人邮箱 }
        approvedBy: { type: string, description: 审批人邮箱 }
        submittedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        recalledAt: { type: string, format: date-time }
        stats: { $ref: '#/components/schemas/CampaignStats' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CampaignPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Campaign' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    AudienceEstimate:
      type: object
      required: [count]
      properties:
        count: { type: integer }
    CampaignRejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 200 }
    CampaignTestRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string }
    CampaignTestResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [userId, status]
            properties:
              userId: { type: string }
              status: { type: string, enum: [sent, no_device, failed, not_found] }
    ConfigNamespace:
      type: string
      enum: [feature, ui, quota, endpoint, killswitch, app]
    ConfigValueType:
      type: string
      enum: [bool, int, float, string, json]
    ConfigApplyMode:
      type: string
      enum: [immediate, next_launch]
    ConfigCondition:
      type: object
      required: [attr, op, values]
      properties:
        attr:
          type: string
          enum: [user_id, app_version, platform, os_version, plan, region, locale, channel, registered_at]
        op:
          type: string
          enum: [eq, neq, in, not_in, semver_gte, semver_lt, before, after]
          description: semver_* 只用于 app_version / os_version；before / after 只用于 registered_at（日期 2026-10-24）
        values:
          type: array
          items: { type: string }
    ConfigRollout:
      type: object
      required: [percent, value]
      properties:
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: 命中条件的用户中按 sha256(salt:user_id) 分桶放量的比例，精度 0.01
        value:
          nullable: true
          description: 放量部分拿到的值
        salt:
          type: string
          description: 默认等于 key；改了会重新洗牌
    ConfigRule:
      type: object
      required: [id, when]
      description: 自上而下匹配，第一条命中的生效。value 与 rollout 二选一；rollout 没抽中的继续往下匹配
      properties:
        id: { type: string, example: r1 }
        note: { type: string }
        when:
          type: array
          description: 全部满足才命中；空数组表示所有人
          items: { $ref: '#/components/schemas/ConfigCondition' }
        value:
          nullable: true
        rollout: { $ref: '#/components/schemas/ConfigRollout' }
    ConfigKeyState:
      type: object
      description: 一个配置项在某个版本里的内容
      required: [namespace, type, defaultValue, rules, applyMode, clientVisible, expose]
      properties:
        namespace: { $ref: '#/components/schemas/ConfigNamespace' }
        type: { $ref: '#/components/schemas/ConfigValueType' }
        defaultValue:
          nullable: true
        rules:
          type: array
          items: { $ref: '#/components/schemas/ConfigRule' }
        applyMode: { $ref: '#/components/schemas/ConfigApplyMode' }
        clientVisible: { type: boolean }
        expose: { type: boolean }
    ConfigKey:
      type: object
      required: [key, namespace, type, description, owner, defaultValue, rules, applyMode, clientVisible, expose, archived, unpublished, createdAt, updatedAt]
      properties:
        key: { type: string }
        namespace: { $ref: '#/components/schemas/ConfigNamespace' }
        type: { $ref: '#/components/schemas/ConfigValueType' }
        description: { type: string }
        owner: { type: string, description: 负责人 }
        defaultValue:
          nullable: true
        valueSchema:
          type: object
          nullable: true
          additionalProperties: true
          description: json 类型的 JSON Schema
        rules:
          type: array
          items: { $ref: '#/components/schemas/ConfigRule' }
        applyMode: { $ref: '#/components/schemas/ConfigApplyMode' }
        clientVisible: { type: boolean, description: false 表示只给服务端读，不下发到 App }
        expose: { type: boolean, description: App 读取时上报 config_exposure }
        archived: { type: boolean }
        unpublished: { type: boolean, description: 工作副本和线上版本不同 }
        published:
          $ref: '#/components/schemas/ConfigKeyState'
        updatedByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConfigKeyList:
      type: object
      required: [items, publishedVersion]
      properties:
        publishedVersion: { type: integer, format: int64, description: 线上版本号，0 表示还没有发布过 }
        pendingReleaseId: { type: integer, format: int64, description: 待审批的发布 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigKey' }
    ConfigKeyCreate:
      type: object
      required: [key, namespace, type, defaultValue]
      properties:
        key: { type: string, example: briefing.new_card_layout }
        namespace: { $ref: '#/components/schemas/ConfigNamespace' }
        type: { $ref: '#/components/schemas/ConfigValueType' }
        description: { type: string }
        owner: { type: string }
        defaultValue:
          nullable: true
        valueSchema:
          type: object
          nullable: true
          additionalProperties: true
        applyMode: { $ref: '#/components/schemas/ConfigApplyMode' }
        clientVisible: { type: boolean, default: true }
        expose: { type: boolean, default: false }
    ConfigKeyPatch:
      type: object
      properties:
        namespace: { $ref: '#/components/schemas/ConfigNamespace' }
        description: { type: string }
        owner: { type: string }
        defaultValue:
          nullable: true
          description: 不传表示不改；json 类型要改成 null 时传 defaultValueNull=true
        defaultValueNull: { type: boolean }
        valueSchema:
          type: object
          additionalProperties: true
        clearValueSchema: { type: boolean }
        rules:
          type: array
          items: { $ref: '#/components/schemas/ConfigRule' }
        applyMode: { $ref: '#/components/schemas/ConfigApplyMode' }
        clientVisible: { type: boolean }
        expose: { type: boolean }
        archived: { type: boolean }
    ConfigChange:
      type: object
      required: [key, kind]
      properties:
        key: { type: string }
        kind:
          type: string
          enum: [added, removed, changed]
        before: { $ref: '#/components/schemas/ConfigKeyState' }
        after: { $ref: '#/components/schemas/ConfigKeyState' }
    ConfigChanges:
      type: object
      required: [publishedVersion, changes, publishesDirectly]
      properties:
        publishedVersion: { type: integer, format: int64 }
        publishesDirectly:
          type: boolean
          description: 当前管理员提交这些改动会不会直接上线（不需要审批）
        changes:
          type: array
          items: { $ref: '#/components/schemas/ConfigChange' }
    ConfigReleaseStatus:
      type: string
      enum: [pending, published, rejected, superseded]
    ConfigRelease:
      type: object
      required: [id, status, note, createdByEmail, decidedByEmail, decisionNote, createdAt]
      properties:
        id: { type: integer, format: int64 }
        version: { type: integer, format: int64, description: 只有已发布的有 }
        status: { $ref: '#/components/schemas/ConfigReleaseStatus' }
        note: { type: string }
        rolledBackFrom: { type: integer, format: int64, description: 回滚来源的发布 id }
        createdByEmail: { type: string }
        decidedByEmail: { type: string }
        decisionNote: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        current: { type: boolean, description: 是当前线上版本 }
    ConfigReleasePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigRelease' }
        nextCursor: { type: string }
    ConfigReleaseDetail:
      allOf:
        - $ref: '#/components/schemas/ConfigRelease'
        - type: object
          required: [changes, baseVersion]
          properties:
            baseVersion: { type: integer, format: int64, description: changes 的比较基准版本，0 表示空 }
            changes:
              type: array
              items: { $ref: '#/components/schemas/ConfigChange' }
    ConfigReleaseRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }
    ConfigPreviewRequest:
      type: object
      properties:
        source:
          type: string
          enum: [published, working]
          default: published
          description: working 用工作副本预览尚未发布的规则
        userId: { type: string }
        phone: { type: string, description: 与 userId 二选一 }
        installId: { type: string }
        appVersion: { type: string }
        platform: { type: string, default: ios }
        osVersion: { type: string }
        channel: { type: string }
        locale: { type: string }
    ConfigPreviewValue:
      type: object
      required: [key, value, isDefault, clientVisible]
      properties:
        key: { type: string }
        value:
          nullable: true
        ruleId: { type: string }
        isDefault: { type: boolean }
        clientVisible: { type: boolean }
    ConfigPreview:
      type: object
      required: [version, values]
      properties:
        version: { type: integer, format: int64, description: 预览所用的版本，working 时为 0 }
        userId: { type: string }
        plan: { type: string }
        values:
          type: array
          items: { $ref: '#/components/schemas/ConfigPreviewValue' }
