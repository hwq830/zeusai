openapi: 3.0.3
info:
  title: Zeus Admin API
  version: 0.1.0
  description: |
    管理员控制台（hwq830/zeusai-admin）与服务端 admin 进程之间的接口契约。服务端用 oapi-codegen
    生成接口层，控制台用 openapi-typescript 生成类型。

    约定：
    - 接口挂在 `/admin/v1` 下，由独立进程 `server/cmd/admin` 提供，只在内网 / VPN 暴露，不与 App 的 api 进程共用端口。
    - 鉴权：`Authorization: Bearer <token>`，令牌由 `POST /admin/v1/auth/login` 签发，12 小时有效，与 App 令牌密钥不同。
    - 角色：`owner` 全部权限（含管理员账号、推送活动审批）；`operator` 用户、额度、模板、连接器、任务、用户反馈、推送活动（编辑和提交）；
      `moderator` 内容审核、停用用户、用户反馈；`viewer` 只读。越权返回 403 `forbidden`。
    - 用户内容：查看报告 / 简报正文要 `content.read`（owner、operator、moderator），每次查看记审计日志 `content.view`，
      `viewer` 只能看列表；重新生成、立即运行、暂停订阅、处理异常要 `content.write`（owner、operator）；
      下架和隐藏单条要 `moderation.write`；退还额度要 `users.write`。后台发起的任务不计入用户额度。
    - 配置中心：`operator` 编辑配置项规则、提交发布、回滚；`owner` 另可新建 / 归档配置项、改命名空间、审批发布。
      生产环境（ZEUS_ENV=prod）提交后需 owner 审批，以下情况直接上线：只改动 killswitch 命名空间里已有的配置项；
      提交人是唯一的 owner。其他环境提交即上线。
    - 所有写操作记入审计日志（`GET /admin/v1/audit-log`）。
    - 金额单位为人民币元（`costCny`），由模型网关按每百万 token 单价计算。
    - 列表统一 `cursor` + `limit` 分页，响应带 `nextCursor`，为空表示没有更多。错误格式与 App 契约相同。
servers:
  - url: http://localhost:8081
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: dashboard
  - name: users
  - name: templates
  - name: connectors
  - name: moderation
  - name: content
  - name: tasks
  - name: costs
  - name: providerKeys
  - name: modelRouting
  - name: modelPrices
  - name: analytics
  - name: admins
  - name: feedback
  - name: campaigns
  - name: config

paths:
  # ---------------------------------------------------------------- auth
  /admin/v1/auth/login:
    post:
      tags: [auth]
      operationId: adminLogin
      summary: 邮箱密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/me:
    get:
      tags: [auth]
      operationId: getAdminMe
      summary: 当前管理员
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/me/password:
    post:
      tags: [auth]
      operationId: changeAdminPassword
      summary: 修改自己的密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: 已修改 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- dashboard
  /admin/v1/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: 运营概览（按 Asia/Shanghai 计日）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- users
  /admin/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 用户列表
      parameters:
        - name: q
          in: query
          description: 用户 id、手机号片段或昵称
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
        - name: plan
          in: query
          schema: { type: string }
        - name: uiLanguage
          in: query
          description: 按 App 显示语言筛选
          schema: { type: string, enum: [zh, zh-Hant, en] }
        - name: market
          in: query
          description: 按地区筛选
          schema: { $ref: '#/components/schemas/Market' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      summary: 用户详情（额度、定时简报、近 30 天成本）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [users]
      operationId: updateUserPlan
      summary: 修改会员方案
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPlanPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}/token-grants:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: grantUserTokens
      summary: 给用户加赠本月 token（计入加赠当月，不结转）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaGrantInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}/quota:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      operationId: setUserQuota
      summary: 设置额度覆盖（字段为空表示沿用方案额度）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaOverrideInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [users]
      operationId: clearUserQuota
      summary: 清除额度覆盖
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}/disable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: disableUser
      summary: 停用账号（注销登录态，暂停其定时简报）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisableUserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/users/{userId}/enable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: enableUser
      summary: 恢复账号（恢复因停用而暂停的定时简报）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/plans:
    get:
      tags: [users]
      operationId: listPlans
      summary: 方案与额度（代码内配置，只读）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- templates
  /admin/v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: 模板列表；official 为官方模板，custom 为用户自定义模板（用于审核）
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [official, custom], default: official }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [templates]
      operationId: createTemplate
      summary: 新建官方模板
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTemplateInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTemplate' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [templates]
      operationId: getTemplate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTemplate' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [templates]
      operationId: updateTemplate
      summary: 修改模板。官方模板改过后不再被 `zeusctl seed` 覆盖；字段、栏目或来源变化时版本号加 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTemplateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTemplate' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [templates]
      operationId: deleteTemplate
      summary: 删除模板（已订阅的简报保留，但与模板解除关联；官方模板建议改为下架）
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- connectors
  /admin/v1/connectors:
    get:
      tags: [connectors]
      operationId: listConnectors
      summary: 内置工具与 MCP 白名单（含已下架）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminConnector' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/connectors/{connectorId}:
    parameters:
      - name: connectorId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [connectors]
      operationId: updateConnector
      summary: 上下架、默认开启、排序与展示文案。新增 MCP 服务需要改代码（catalog.yaml）后发布
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConnector' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- moderation
  /admin/v1/moderation/terms:
    get:
      tags: [moderation]
      operationId: listModerationTerms
      summary: 屏蔽词（与 ZEUS_MODERATION_KEYWORDS_FILE 合并生效，约 1 分钟内同步到各进程）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModerationTerm' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [moderation]
      operationId: createModerationTerm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationTermInput' }
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationTerm' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/moderation/terms/{termId}:
    parameters:
      - name: termId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [moderation]
      operationId: deleteModerationTerm
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/moderation/events:
    get:
      tags: [moderation]
      operationId: listModerationEvents
      summary: 拦截记录
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [input, output] }
        - name: userId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationEventPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/shares:
    get:
      tags: [moderation]
      operationId: listShares
      summary: 公开分享的报告和简报
      parameters:
        - name: active
          in: query
          description: 只看未撤销且未过期的
          schema: { type: boolean, default: true }
        - name: type
          in: query
          schema:
            type: string
            enum: [report, briefing]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharePage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/shares/{shareId}/revoke:
    parameters:
      - name: shareId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [moderation]
      operationId: revokeShare
      summary: 撤销分享链接
      responses:
        '204': { description: 已撤销 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- content (reports / briefings)
  /admin/v1/reports:
    get:
      tags: [content]
      operationId: listReports
      summary: 全部调研报告（元数据，不含正文），按创建时间倒序
      parameters:
        - { name: q, in: query, description: 标题或题目关键词, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - name: status
          in: query
          description: hidden 表示已下架
          schema: { type: string, enum: [running, done, failed, cancelled, hidden] }
        - { name: depth, in: query, schema: { type: string, enum: [quick, standard, deep] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: rating, in: query, schema: { type: string, enum: [satisfied, unsatisfied, none] } }
        - name: origin
          in: query
          description: direct 用户直接发起；briefing 从简报条目深入调研
          schema: { type: string, enum: [direct, briefing] }
        - { name: shared, in: query, schema: { type: boolean } }
        - { name: minCostCny, in: query, schema: { type: number, format: double } }
        - { name: promptVersion, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [content]
      operationId: getReport
      summary: 报告详情：正文、来源、追问、生成过程、反馈、分享、备注。需要 content.read，每次查看记审计日志
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReportDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/reports/{reportId}/regenerate:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [content]
      operationId: regenerateReport
      summary: 用相同输入重新生成一份新报告（不扣用户额度，旧报告保留）。需要 content.write
      responses:
        '202':
          description: 已开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRunResult' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/reports/{reportId}/hide:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [content]
      operationId: hideReport
      summary: 下架报告：App 显示"已下架"，撤销全部分享，给用户发一条站内信（不推送）。需要 moderation.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HideRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReportDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/reports/{reportId}/unhide:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [content]
      operationId: unhideReport
      summary: 恢复下架的报告（已撤销的分享不会恢复）。需要 moderation.write
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReportDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/reports/{reportId}/refund:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [content]
      operationId: refundReport
      summary: 把这份报告（含追问）计入额度的 token 加回用户本月额度，每份只能退一次。需要 users.write
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResult' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/subscriptions:
    get:
      tags: [content]
      operationId: listSubscriptions
      summary: 全部定时简报订阅，按创建时间倒序
      parameters:
        - { name: q, in: query, description: 订阅名称关键词, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: templateId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, paused] } }
        - name: lastStatus
          in: query
          description: 最近一期的状态；empty 表示生成成功但没有条目
          schema: { type: string, enum: [ready, failed, generating, empty] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/subscriptions/{subscriptionId}/pause:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [content]
      operationId: pauseSubscription
      summary: 暂停订阅（paused_reason=admin）。需要 content.write
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSubscription' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/subscriptions/{subscriptionId}/resume:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [content]
      operationId: resumeSubscription
      summary: 恢复订阅。需要 content.write
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSubscription' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/subscriptions/{subscriptionId}/run:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [content]
      operationId: runSubscription
      summary: 立即生成今天这期（已有则覆盖，旧版本保留在历史里；不扣用户额度）。需要 content.write
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BriefingRunRequest' }
      responses:
        '202':
          description: 已开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRunResult' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/briefings:
    get:
      tags: [content]
      operationId: listBriefings
      summary: 每期简报（元数据），按日期倒序
      parameters:
        - { name: q, in: query, description: 标题或导语关键词, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: subscriptionId, in: query, schema: { type: string } }
        - { name: templateId, in: query, schema: { type: string } }
        - name: status
          in: query
          description: empty 生成成功但没有条目；hidden 已下架
          schema: { type: string, enum: [generating, ready, failed, empty, hidden] }
        - { name: from, in: query, description: 起始日期（含）, schema: { type: string, format: date } }
        - { name: to, in: query, description: 结束日期（含）, schema: { type: string, format: date } }
        - { name: read, in: query, schema: { type: boolean } }
        - { name: disliked, in: query, description: 只看有「一般」评价的, schema: { type: boolean } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BriefingPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/briefings/{briefingId}:
    parameters:
      - $ref: '#/components/parameters/BriefingId'
    get:
      tags: [content]
      operationId: getBriefing
      summary: 简报详情。需要 content.read，每次查看记审计日志；私密区块默认打码，带 revealReason 时显示并单独记日志
      parameters:
        - { name: revealReason, in: query, description: 查看私密区块的原因, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBriefingDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/briefings/{briefingId}/regenerate:
    parameters:
      - $ref: '#/components/parameters/BriefingId'
    post:
      tags: [content]
      operationId: regenerateBriefing
      summary: 重新生成这一期（只能是订阅时区里今天这期；旧版本进历史；不扣用户额度）。需要 content.write
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BriefingRunRequest' }
      responses:
        '202':
          description: 已开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentRunResult' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/briefings/{briefingId}/hide:
    parameters:
      - $ref: '#/components/parameters/BriefingId'
    post:
      tags: [content]
      operationId: hideBriefing
      summary: 下架整期简报（同报告）。需要 moderation.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HideRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBriefingDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/briefings/{briefingId}/unhide:
    parameters:
      - $ref: '#/components/parameters/BriefingId'
    post:
      tags: [content]
      operationId: unhideBriefing
      summary: 恢复下架的简报。需要 moderation.write
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBriefingDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/briefings/{briefingId}/refund:
    parameters:
      - $ref: '#/components/parameters/BriefingId'
    post:
      tags: [content]
      operationId: refundBriefing
      summary: 退还这一期计入额度的 token，每期只能退一次。需要 users.write
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResult' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/briefings/{briefingId}/items/{itemId}/hide:
    parameters:
      - $ref: '#/components/parameters/BriefingId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [content]
      operationId: hideBriefingItem
      summary: 从用户端隐藏一条（其余条目不受影响，分享页同样不再显示）。需要 moderation.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HideRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBriefingDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/briefings/{briefingId}/items/{itemId}/unhide:
    parameters:
      - $ref: '#/components/parameters/BriefingId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [content]
      operationId: unhideBriefingItem
      summary: 放回隐藏的条目。需要 moderation.write
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBriefingDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/content/notes:
    get:
      tags: [content]
      operationId: listContentNotes
      summary: 内部备注
      parameters:
        - { name: targetType, in: query, required: true, schema: { $ref: '#/components/schemas/NoteTargetType' } }
        - { name: targetId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentNote' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [content]
      operationId: createContentNote
      summary: 添加内部备注（用户看不到）。需要 content.read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentNoteInput' }
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentNote' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/content/issues:
    get:
      tags: [content]
      operationId: listContentIssues
      summary: 异常队列：失败、空简报、来源过少、不满意、"一般"评价、成本过高的内容
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/ContentIssueKind' } }
        - { name: targetType, in: query, schema: { type: string, enum: [report, briefing] } }
        - { name: resolved, in: query, description: true 看已处理的, schema: { type: boolean, default: false } }
        - { name: days, in: query, description: 最近多少天, schema: { type: integer, minimum: 1, maximum: 90, default: 14 } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentIssuePage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/content/issues/resolve:
    post:
      tags: [content]
      operationId: resolveContentIssue
      summary: 标记已处理。需要 content.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentIssueResolve' }
      responses:
        '204': { description: 已处理 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/content/issues/reopen:
    post:
      tags: [content]
      operationId: reopenContentIssue
      summary: 重新打开。需要 content.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentIssueResolve' }
      responses:
        '204': { description: 已重新打开 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- tasks
  /admin/v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 全部任务
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
        - name: userId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: 任务详情与模型调用明细
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/tasks/{taskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: 取消运行中的任务
      responses:
        '202': { description: 已发出取消 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- costs
  /admin/v1/costs:
    get:
      tags: [costs]
      operationId: getCosts
      summary: 成本：按天、按模型、按任务类型、最高成本用户
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostReport' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- analytics
  /admin/v1/analytics/overview:
    get:
      tags: [analytics]
      operationId: getAnalyticsOverview
      summary: 核心指标：门槛 B 三项、DAU/WAU/MAU（较前一周期）、待办、近 30 天活跃与新增、流失预警
      parameters:
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsOverview' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/growth:
    get:
      tags: [analytics]
      operationId: getAnalyticsGrowth
      summary: 用户增长：每日新增（按登录方式）和活跃、平台/版本/语言分布、激活漏斗
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsGrowth' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/retention:
    get:
      tags: [analytics]
      operationId: getAnalyticsRetention
      summary: 留存：按注册周的同期群（from/to 是注册日期范围，默认近 12 周）
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsRetention' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/engagement:
    get:
      tags: [analytics]
      operationId: getAnalyticsEngagement
      summary: 功能使用：简报、模板排行、报告、推送触达
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsEngagement' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/costs:
    get:
      tags: [analytics]
      operationId: getAnalyticsCosts
      summary: 成本与额度：总成本和每活跃用户成本、单次任务成本分布、本月额度用量
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsCosts' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/analytics/quality:
    get:
      tags: [analytics]
      operationId: getAnalyticsQuality
      summary: 任务质量：按类型的失败率和耗时、失败原因 Top 10
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsQuality' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- provider keys
  /admin/v1/model-prices:
    get:
      tags: [modelPrices]
      operationId: listModelPrices
      summary: 百炼模型定价（同步自百炼的价格 + 后台手动价；没同步过时用服务端内置目录）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPriceList' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [modelPrices]
      operationId: setModelPrice
      summary: 手动设置一个模型的价格（仅 owner），之后同步不会覆盖，约 1 分钟内用于计费
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, price]
              properties:
                model: { type: string, maxLength: 120 }
                price: { $ref: '#/components/schemas/ModelPrice' }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 更新后的列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPriceList' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [modelPrices]
      operationId: clearModelPrice
      summary: 去掉手动价格，恢复按同步价（或内置目录）计费（仅 owner）
      parameters:
        - name: model
          in: query
          required: true
          schema: { type: string }
      responses:
        '204': { description: 已恢复 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/model-prices/sync:
    post:
      tags: [modelPrices]
      operationId: syncModelPrices
      summary: 从百炼实时拉取全部文本模型和价格（仅 owner）；手动价格保留
      responses:
        '200':
          description: 失败也返回 200，ok=false，原有价格不变
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPriceSyncResult' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/model-routing:
    get:
      tags: [modelRouting]
      operationId: getModelRouting
      summary: 模型路由：各档位的调用顺序、各环节的指定、熔断、实际生效的调用链、近 24 小时调用和历史版本
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouting' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [modelRouting]
      operationId: saveRoutingSettings
      summary: 保存各档位的调用顺序和熔断设置（仅 owner），约 1 分钟内生效；保存后记一个历史版本
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutingSettingsInput' }
      responses:
        '200':
          description: 保存后的路由
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouting' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/model-routing/versions/{versionId}/restore:
    parameters:
      - name: versionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [modelRouting]
      operationId: restoreRoutingVersion
      summary: 把路由（档位顺序、熔断、环节指定）恢复成某个历史版本（仅 owner），记为一个新版本
      responses:
        '200':
          description: 恢复后的路由
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouting' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/model-routing/test:
    post:
      tags: [modelRouting]
      operationId: testModel
      summary: 用当前 Key 调一次指定模型（仅 owner），输出 1 个 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider: { type: string }
                model: { type: string }
      responses:
        '200':
          description: 测试结果（失败也返回 200，ok=false）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKeyTest' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/model-routing/providers/{provider}/models:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [modelRouting]
      operationId: listProviderModels
      summary: 用这个服务商当前的 Key 实时拉取可用模型（GET /models）
      responses:
        '200':
          description: 拉取失败也返回 200，error 说明原因
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items: { type: string }
                  error: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/model-routing/{scope}:
    parameters:
      - $ref: '#/components/parameters/ModelScope'
    put:
      tags: [modelRouting]
      operationId: setModelOverride
      summary: 给某个环节指定模型（仅 owner），先试它，失败后按所在档位的顺序继续；约 1 分钟内生效
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelOverrideInput' }
      responses:
        '200':
          description: 保存后的路由
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelRouting' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [modelRouting]
      operationId: deleteModelOverride
      summary: 环节恢复为跟随档位（仅 owner）
      responses:
        '204': { description: 已恢复 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/providers:
    post:
      tags: [providerKeys]
      operationId: createModelProvider
      summary: 新增模型服务商（OpenAI 兼容接口，仅 owner），约 1 分钟内网关可用
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelProviderInput' }
      responses:
        '201':
          description: 新服务商
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyProvider' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [providerKeys]
      operationId: updateModelProvider
      summary: 修改后台新增的模型服务商（仅 owner）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelProviderUpdate' }
      responses:
        '200':
          description: 更新后的服务商
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyProvider' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [providerKeys]
      operationId: deleteModelProvider
      summary: 删除后台新增的模型服务商及其 Key（仅 owner）；「模型指定」还在用时不能删
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/search-routing:
    get:
      tags: [providerKeys]
      operationId: getSearchRouting
      summary: 搜索路由：主用和备用搜索服务商的顺序，以及支持的搜索接口
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchRouting' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [providerKeys]
      operationId: saveSearchRouting
      summary: 设置主用和备用搜索服务商（仅 owner），约 1 分钟内生效
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRoutingInput' }
      responses:
        '200':
          description: 保存后的路由
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchRouting' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/search-providers:
    post:
      tags: [providerKeys]
      operationId: createSearchProvider
      summary: 新增搜索服务商（仅 owner）；可同时保存 Key、加入备用
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchProviderInput' }
      responses:
        '201':
          description: 新服务商
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyProvider' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/search-providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [providerKeys]
      operationId: updateSearchProvider
      summary: 修改搜索服务商（仅 owner）；正在主用或备用的不能停用
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchProviderUpdate' }
      responses:
        '200':
          description: 更新后的服务商
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyProvider' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [providerKeys]
      operationId: deleteSearchProvider
      summary: 删除后台新增的搜索服务商及其 Key（仅 owner）；正在主用或备用的不能删，内置的博查不能删
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys:
    get:
      tags: [providerKeys]
      operationId: listProviderKeys
      summary: 模型和搜索服务商的 API Key（只返回末 4 位）及每个服务商当前用的是哪把
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKeyList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [providerKeys]
      operationId: createProviderKey
      summary: 保存一把 Key（仅 owner）。activate 为 true 时同时设为该服务商的启用 Key，约 1 分钟内各进程生效
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderKeyInput' }
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKey' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/test:
    post:
      tags: [providerKeys]
      operationId: testNewProviderKey
      summary: 保存前测试一把 Key（仅 owner），模型发 1 个 token、搜索发一次查询
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, apiKey]
              properties:
                provider: { type: string }
                apiKey: { type: string }
                baseUrl: { type: string, description: 不填用默认地址 }
                params: { $ref: '#/components/schemas/KeyTestParams' }
      responses:
        '200':
          description: 测试结果（失败也返回 200，ok=false）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKeyTest' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    patch:
      tags: [providerKeys]
      operationId: updateProviderKey
      summary: 改备注或 API 地址（仅 owner），启用中的 Key 约 1 分钟内生效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 50 }
                baseUrl: { type: string, maxLength: 300, description: 空字符串表示恢复默认地址 }
      responses:
        '200':
          description: 更新后的 Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKey' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [providerKeys]
      operationId: deleteProviderKey
      summary: 删除（仅 owner，启用中的 Key 需先停用）
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/{keyId}/test:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      tags: [providerKeys]
      operationId: testProviderKey
      summary: 测试已保存的 Key（仅 owner），结果记在这把 Key 上；不指定参数时传 {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                params: { $ref: '#/components/schemas/KeyTestParams' }
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKeyTest' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/{keyId}/activate:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      tags: [providerKeys]
      operationId: activateProviderKey
      summary: 设为该服务商的启用 Key（仅 owner），同服务商其他 Key 自动停用
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKey' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/provider-keys/{keyId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      tags: [providerKeys]
      operationId: deactivateProviderKey
      summary: 停用（仅 owner），该服务商回退到环境变量里的 Key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKey' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- admins
  /admin/v1/admins:
    get:
      tags: [admins]
      operationId: listAdmins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [admins]
      operationId: createAdmin
      summary: 新建管理员，返回一次性初始密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWithPassword' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/admins/{adminId}:
    parameters:
      - $ref: '#/components/parameters/AdminId'
    patch:
      tags: [admins]
      operationId: updateAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/admins/{adminId}/reset-password:
    parameters:
      - $ref: '#/components/parameters/AdminId'
    post:
      tags: [admins]
      operationId: resetAdminPassword
      summary: 重置密码，返回一次性新密码
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWithPassword' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/audit-log:
    get:
      tags: [admins]
      operationId: listAuditLog
      summary: 审计日志
      parameters:
        - name: targetType
          in: query
          schema: { type: string }
        - name: targetId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- feedback
  /admin/v1/feedback:
    get:
      tags: [feedback]
      operationId: listFeedback
      summary: 用户意见反馈
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FeedbackStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/FeedbackType' }
        - name: userId
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: 按内容搜索
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/feedback/{feedbackId}:
    parameters:
      - $ref: '#/components/parameters/FeedbackId'
    get:
      tags: [feedback]
      operationId: getFeedback
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackDetail' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [feedback]
      operationId: updateFeedback
      summary: 改状态、写内部备注（用户看不到备注）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/feedback/{feedbackId}/replies:
    parameters:
      - $ref: '#/components/parameters/FeedbackId'
    post:
      tags: [feedback]
      operationId: replyFeedback
      summary: 回复用户。用户在「我的反馈」里看到并收到推送（zeus://feedback/{id}）；待处理的反馈自动转为处理中
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackReplyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackDetail' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/report-feedback:
    get:
      tags: [feedback]
      operationId: listReportFeedback
      summary: 报告满意度评分，按最近评分排序
      parameters:
        - name: rating
          in: query
          schema: { type: string, enum: [satisfied, unsatisfied] }
        - name: reason
          in: query
          schema: { $ref: '#/components/schemas/ReportFeedbackReason' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportFeedbackPage' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- campaigns
  /admin/v1/campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: 运营推送活动，按创建时间倒序
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CampaignStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: 新建草稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/audience-estimate:
    post:
      tags: [campaigns]
      operationId: estimateCampaignAudience
      summary: 估算目标人数
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignAudience' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceEstimate' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: 详情和送达统计
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [campaigns]
      operationId: updateCampaign
      summary: 修改草稿（被驳回的活动回到草稿）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [campaigns]
      operationId: deleteCampaign
      summary: 删除草稿
      responses:
        '204': { description: OK }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/submit:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: submitCampaign
      summary: 提交审批（草稿 → 待审批）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/approve:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: approveCampaign
      summary: 审批通过（仅 owner）。没有定时则立即开始发送
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/reject:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: rejectCampaign
      summary: 驳回，回到草稿（仅 owner）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRejectRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/cancel:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: cancelCampaign
      summary: 取消待审批、已排期或发送中的活动；已写入的消息保留，可再撤回
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/recall:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: recallCampaign
      summary: 撤回：从所有用户的消息中心移除（已送达的推送无法撤回）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        default: { $ref: '#/components/responses/Error' }
  /admin/v1/campaigns/{campaignId}/test-send:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [campaigns]
      operationId: testSendCampaign
      summary: 发测试推送到指定 App 用户的设备（标题加「[测试]」，不进消息中心，不受频控）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignTestRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignTestResult' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/keys:
    get:
      tags: [config]
      operationId: listConfigKeys
      summary: 配置项（工作副本），附线上版本的值
      parameters:
        - name: archived
          in: query
          description: true 时包含已归档的配置项
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigKeyList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [config]
      operationId: createConfigKey
      summary: 新建配置项（owner）。新建后要发布才会下发
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigKeyCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigKey' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/keys/{key}:
    parameters:
      - $ref: '#/components/parameters/ConfigKeyName'
    get:
      tags: [config]
      operationId: getConfigKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigKey' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [config]
      operationId: updateConfigKey
      summary: 修改工作副本。改命名空间、归档需要 owner；类型不能改
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigKeyPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigKey' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/changes:
    get:
      tags: [config]
      operationId: listConfigChanges
      summary: 工作副本相对线上版本的改动（发布前的 diff）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigChanges' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases:
    get:
      tags: [config]
      operationId: listConfigReleases
      summary: 发布记录，最新在前
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleasePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [config]
      operationId: submitConfigRelease
      summary: 提交发布。按审批规则直接上线（status=published）或等待审批（status=pending）
      description: 同一时间只有一个待审批的发布，新提交会把旧的待审批发布标为 superseded。没有改动时返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigReleaseRequest' }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags: [config]
      operationId: getConfigRelease
      summary: 发布详情。已发布的与上一个发布版本比较，待审批的与当前线上版本比较
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases/{releaseId}/approve:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [config]
      operationId: approveConfigRelease
      summary: 审批并上线（owner；不能审批自己提交的，除非只有一个 owner）
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigReleaseRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases/{releaseId}/reject:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [config]
      operationId: rejectConfigRelease
      summary: 驳回待审批的发布（owner）
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigReleaseRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/releases/{releaseId}/rollback:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    post:
      tags: [config]
      operationId: rollbackConfigRelease
      summary: 把这个已发布版本的内容作为新版本重新发布，同时把工作副本恢复成它（审批规则同提交）
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigReleaseRequest' }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/config/preview:
    post:
      tags: [config]
      operationId: previewConfig
      summary: 某个用户 / 设备会拿到什么值、命中哪条规则
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPreviewRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigPreview' }
        default: { $ref: '#/components/responses/Error' }

  /admin/v1/calls:
    get:
      tags: [tasks]
      operationId: listExternalCalls
      summary: 每次模型和搜索调用的独立记录（含失败、超时、跳过）
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [model, search] } }
        - { name: provider, in: query, schema: { type: string, maxLength: 100 } }
        - { name: model, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [running, success, empty, failed, timeout, cancelled, skipped, unknown] } }
        - { name: taskId, in: query, schema: { type: string, format: uuid } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: 按记录创建顺序倒序；游标分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalCallList' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string }
    BriefingId:
      name: briefingId
      in: path
      required: true
      schema: { type: string }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    AdminId:
      name: adminId
      in: path
      required: true
      schema: { type: string }
    AnalyticsFrom:
      name: from
      in: query
      description: 起始日（北京时间，含），默认近 30 天
      schema: { type: string, format: date }
    AnalyticsTo:
      name: to
      in: query
      description: 截止日（含），默认今天；范围最长 366 天
      schema: { type: string, format: date }
    AnalyticsPlatform:
      name: platform
      in: query
      description: 按用户最近使用的平台筛选，不传为全部
      schema: { type: string, enum: [ios, android] }
    ModelScope:
      name: scope
      in: path
      required: true
      description: 环节（如 report.write）；档位的顺序用 PUT /admin/v1/model-routing 保存
      schema: { type: string }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema: { type: string }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string }
    ConfigKeyName:
      name: key
      in: path
      required: true
      schema: { type: string, example: report.create_enabled }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ------------------------------------------------------------ common
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string, example: forbidden }
        message: { type: string }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: true
    NextCursor:
      type: string
      nullable: true
    Role:
      type: string
      enum: [owner, operator, moderator, viewer]

    # ------------------------------------------------------------ auth & admins
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [token, expiresIn, admin]
      properties:
        token: { type: string }
        expiresIn: { type: integer, description: 秒 }
        admin: { $ref: '#/components/schemas/AdminUser' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 10 }
    AdminUser:
      type: object
      required: [id, email, name, role, disabled, permissions, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        permissions:
          type: array
          description: 该角色拥有的写权限，控制台据此显示按钮
          items: { type: string, example: users.write }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateAdminRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    AdminPatch:
      type: object
      properties:
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
    AdminWithPassword:
      type: object
      required: [admin, password]
      properties:
        admin: { $ref: '#/components/schemas/AdminUser' }
        password: { type: string, description: 只显示这一次 }
    AuditEntry:
      type: object
      required: [id, adminEmail, action, targetType, targetId, detail, createdAt]
      properties:
        id: { type: integer, format: int64 }
        adminEmail: { type: string }
        action: { type: string, example: user.disable }
        targetType: { type: string }
        targetId: { type: string }
        detail:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ dashboard
    Dashboard:
      type: object
      required: [users, activeUsers, tasksToday, reportsThisMonth, cost, daily, satisfaction]
      properties:
        users:
          type: object
          required: [total, newToday, new7d, disabled]
          properties:
            total: { type: integer }
            newToday: { type: integer }
            new7d: { type: integer }
            disabled: { type: integer }
        activeUsers:
          type: object
          required: [d1, d7, d30]
          description: 窗口内发起过任务（含定时简报）的用户数
          properties:
            d1: { type: integer }
            d7: { type: integer }
            d30: { type: integer }
        tasksToday:
          type: array
          items: { $ref: '#/components/schemas/TaskCount' }
        reportsThisMonth: { type: integer }
        cost:
          type: object
          required: [todayCny, last7dCny, last30dCny]
          properties:
            todayCny: { type: number, format: double }
            last7dCny: { type: number, format: double }
            last30dCny: { type: number, format: double }
            avgReportCostCny:
              type: number
              format: double
              nullable: true
              description: 近 30 天已完成报告的平均成本（门槛 B 要求 ≤ ¥3）
        daily:
          type: array
          description: 近 14 天
          items: { $ref: '#/components/schemas/DailyPoint' }
        satisfaction: { $ref: '#/components/schemas/Satisfaction' }
        shares: { $ref: '#/components/schemas/ShareStats' }
    ShareStats:
      type: object
      required: [createdToday, created7d, views7d, wechatViews7d, ctaClicks7d, channels7d]
      description: 近 7 天新建的分享链接及其累计访问 / 点击
      properties:
        createdToday: { type: integer }
        created7d: { type: integer }
        views7d: { type: integer }
        wechatViews7d: { type: integer }
        ctaClicks7d: { type: integer }
        briefingShareRate7d:
          type: number
          format: double
          nullable: true
          description: 被分享过的简报数 / 生成的简报数（近 7 天）
        channels7d:
          type: array
          items:
            type: object
            required: [channel, shares]
            properties:
              channel: { type: string }
              shares: { type: integer }
    TaskCount:
      type: object
      required: [kind, status, count]
      properties:
        kind: { type: string }
        status: { type: string }
        count: { type: integer }
    DailyPoint:
      type: object
      required: [date, newUsers, activeUsers, tasks, costCny]
      properties:
        date: { type: string, format: date }
        newUsers: { type: integer }
        activeUsers: { type: integer }
        tasks: { type: integer }
        costCny: { type: number, format: double }

    # ------------------------------------------------------------ users
    UserSummary:
      type: object
      required: [id, nickname, phoneMasked, loginMethods, planCode, timezone, uiLanguage, reportLanguage, market, disabled, createdAt]
      properties:
        id: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        loginMethods:
          type: array
          items: { type: string, enum: [phone, apple, wechat] }
        planCode: { type: string }
        planExpiresAt: { type: string, format: date-time, nullable: true }
        timezone: { type: string }
        uiLanguage: { type: string, enum: [zh, zh-Hant, en], description: App 显示语言，简报和推送跟随它 }
        reportLanguage: { type: string, enum: [auto, zh, zh-Hant, en], description: 报告生成语言，auto 跟随显示语言 }
        market: { $ref: '#/components/schemas/Market' }
        disabled: { type: boolean }
        disabledReason: { type: string }
        disabledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    QuotaItem:
      type: object
      required: [used, limit, planLimit]
      properties:
        used: { type: integer }
        limit: { type: integer, description: 生效额度（含覆盖） }
        planLimit: { type: integer, description: 方案额度 }
        resetsAt: { type: string, format: date-time, nullable: true }
    TokenQuotaItem:
      type: object
      description: 本月计费 token（各模型按 quota.token_weights 折算后的统一 token；失败任务不计入）
      required: [used, limit, planLimit, granted, resetsAt]
      properties:
        used: { type: integer, format: int64 }
        limit: { type: integer, format: int64, description: 生效额度（含覆盖与本月加赠） }
        planLimit: { type: integer, format: int64, description: 方案额度 }
        granted: { type: integer, format: int64, description: 本月加赠合计 }
        resetsAt: { type: string, format: date-time }
    QuotaGrant:
      type: object
      required: [id, tokens, reason, createdAt]
      properties:
        id: { type: integer, format: int64 }
        tokens: { type: integer, format: int64 }
        reason: { type: string }
        grantedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    QuotaGrantInput:
      type: object
      required: [tokens, reason]
      properties:
        tokens: { type: integer, format: int64, minimum: 1, maximum: 100000000 }
        reason: { type: string, minLength: 1, maxLength: 200, description: 原因，写入审计日志 }
    QuotaOverride:
      type: object
      required: [note, updatedAt]
      properties:
        subscriptions: { type: integer, nullable: true }
        tokensPerMonth: { type: integer, format: int64, nullable: true }
        note: { type: string }
        updatedAt: { type: string, format: date-time }
    SubscriptionSummary:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        templateId: { type: string, nullable: true }
        status: { type: string }
        pausedReason: { type: string, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    UserDetail:
      type: object
      required: [user, quota, subscriptions, cost30dCny, tasks30d]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        phone:
          type: string
          nullable: true
          description: 完整手机号，仅对有 users.write 权限的角色返回
        quota:
          type: object
          required: [subscriptions, tokens, grants]
          properties:
            subscriptions: { $ref: '#/components/schemas/QuotaItem' }
            tokens: { $ref: '#/components/schemas/TokenQuotaItem' }
            override: { $ref: '#/components/schemas/QuotaOverride' }
            grants:
              type: array
              description: 本月加赠记录，最近的在前
              items: { $ref: '#/components/schemas/QuotaGrant' }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionSummary' }
        cost30dCny: { type: number, format: double }
        tasks30d: { type: integer }
    UserPlanPatch:
      type: object
      required: [planCode]
      properties:
        planCode: { type: string, example: free }
        planExpiresAt: { type: string, format: date-time, nullable: true }
    QuotaOverrideInput:
      type: object
      required: [note]
      properties:
        subscriptions: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        tokensPerMonth: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 1000000000 }
        note: { type: string, maxLength: 200, description: 原因，写入审计日志 }
    DisableUserRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }
    Plan:
      type: object
      required: [code, subscriptions, tokensPerMonth]
      properties:
        code: { type: string }
        subscriptions: { type: integer }
        tokensPerMonth: { type: integer, format: int64 }

    # ------------------------------------------------------------ templates
    TemplateField:
      type: object
      required: [key, label, type, required]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, tags, number, select, multiselect] }
        required: { type: boolean }
        placeholder: { type: string }
        help: { type: string }
        options:
          type: array
          items: { type: string }
        max: { type: integer }
        min: { type: integer }
    TemplateSection:
      type: object
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
        instruction: { type: string }
        maxItems: { type: integer }
        searchRegion:
          type: string
          enum: [CN, TW, HK, MO, SG, MY, US, other, global]
          description: 本栏目的内容地区；不填继承模板或用户地区，global 表示全球
        private:
          type: boolean
          description: 本节含个人信息，用户分享简报时自动隐藏
    TemplateSource:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [search, site, rss, connector] }
        value: { type: string }
        label: { type: string }
    Schedule:
      type: object
      required: [freq, time, tz]
      properties:
        freq: { type: string, enum: [daily, weekly, monthly] }
        weekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        monthDay: { type: integer, minimum: 1, maximum: 28 }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        tz: { type: string }
    AdminTemplateInput:
      type: object
      required: [name, fields, sections, published, sortOrder]
      properties:
        searchRegion:
          type: string
          enum: [CN, TW, HK, MO, SG, MY, US, other, global]
          description: 模板内容地区；不填跟随用户，global 为全球；栏目可单独覆盖
        name: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 200 }
        category: { type: string }
        icon: { type: string, description: SF Symbol 名 }
        fields:
          type: array
          items: { $ref: '#/components/schemas/TemplateField' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/TemplateSection' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/TemplateSource' }
        defaultSchedule: { $ref: '#/components/schemas/Schedule' }
        defaultLength: { type: string, enum: [short, standard, long] }
        requiredConnectors:
          type: array
          items: { type: string }
        published: { type: boolean, description: 官方模板是否在 App 模板库展示 }
        sortOrder: { type: integer }
        slug:
          type: string
          description: 仅新建时有效；留空则不与 prompts/briefing-templates 关联
        translations:
          type: object
          description: 其他语言的文案，键为语言（目前只有 en）；缺的字段回落中文
          additionalProperties: { $ref: '#/components/schemas/TemplateTranslation' }
        markets:
          type: array
          description: 只对这些地区的用户显示；不填表示所有地区
          items: { $ref: '#/components/schemas/Market' }
        marketSources:
          type: object
          description: 按地区替换信息来源，键为地区；没写的地区用默认 sources。台港澳的搜索词会自动转成繁体
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/TemplateSource' }
    Market:
      type: string
      description: 用户地区（App 按手机地区设置上报）；other = 其他地区
      enum: [CN, TW, HK, MO, SG, MY, US, other]
    TemplateTranslation:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        category: { type: string }
        fields:
          type: object
          description: 键为字段 key
          additionalProperties:
            type: object
            properties:
              label: { type: string }
              placeholder: { type: string }
              help: { type: string }
              options:
                type: array
                description: 与中文选项一一对应，个数不同时不生效
                items: { type: string }
        sections:
          type: object
          description: 键为栏目 key
          additionalProperties:
            type: object
            properties:
              title: { type: string }
              instruction: { type: string }
    AdminTemplate:
      allOf:
        - $ref: '#/components/schemas/AdminTemplateInput'
        - type: object
          required: [id, kind, version, adminManaged, subscriptionCount, createdAt, updatedAt]
          properties:
            id: { type: string }
            kind: { type: string, enum: [official, custom] }
            ownerId: { type: string, nullable: true }
            version: { type: integer }
            adminManaged: { type: boolean, description: 在控制台改过，seed 不再覆盖 }
            subscriptionCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    TemplatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminTemplate' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ connectors
    ConnectorTool:
      type: object
      required: [name, write]
      properties:
        name: { type: string }
        description: { type: string }
        write: { type: boolean }
    AdminConnector:
      type: object
      required: [id, name, description, kind, category, transport, requiresAuth, defaultOn, available, sortOrder, tools, adminManaged, enabledUsers, authorizedUsers]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        iconUrl: { type: string }
        kind: { type: string }
        category: { type: string }
        transport: { type: string, description: builtin / http }
        mcpVersion: { type: string }
        requiresAuth: { type: boolean }
        defaultOn: { type: boolean }
        available: { type: boolean, description: false 为下架，App 不再展示 }
        sortOrder: { type: integer }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ConnectorTool' }
        adminManaged: { type: boolean }
        enabledUsers: { type: integer, description: 主动开启的用户数 }
        authorizedUsers: { type: integer }
    ConnectorPatch:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        available: { type: boolean }
        defaultOn: { type: boolean }
        sortOrder: { type: integer }

    # ------------------------------------------------------------ moderation
    ModerationTerm:
      type: object
      required: [id, term, note, createdAt]
      properties:
        id: { type: integer, format: int64 }
        term: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    ModerationTermInput:
      type: object
      required: [term]
      properties:
        term: { type: string, minLength: 1, maxLength: 50 }
        note: { type: string, maxLength: 200 }
    ModerationEvent:
      type: object
      required: [id, kind, reason, excerpt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: string, nullable: true }
        nickname: { type: string }
        phoneMasked: { type: string }
        kind: { type: string, enum: [input, output] }
        reason: { type: string }
        excerpt: { type: string, description: 被拦截文本的前 200 字 }
        createdAt: { type: string, format: date-time }
    ModerationEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ModerationEvent' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    AdminShare:
      type: object
      required: [id, targetType, targetId, title, userId, nickname, phoneMasked, scope, channel, viewCount, wechatViewCount, ctaClicks, createdAt]
      properties:
        id: { type: string }
        targetType:
          type: string
          enum: [report, briefing]
        targetId:
          type: string
          description: 报告或简报 id
        itemId:
          type: string
          description: 单条分享时的条目 id
        title: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        scope:
          type: string
          description: full / summary / item
        channel:
          type: string
          description: 首次分享渠道，空表示旧版 App 或未上报
        viewCount:
          type: integer
          description: 访问人数（同一访客每天计一次）
        wechatViewCount: { type: integer }
        ctaClicks:
          type: integer
          description: 分享页"生成我的"按钮点击数
        url: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    SharePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminShare' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    # ------------------------------------------------------------ content (reports / briefings)
    ContentSource:
      type: object
      required: [url, title]
      properties:
        url: { type: string }
        title: { type: string }
        siteName: { type: string }
        domain: { type: string }
    AdminReportRow:
      type: object
      required: [id, userId, nickname, phoneMasked, title, depth, status, hidden, sourceCount, wordCount, costCny, followups, shares, shareViews, fromBriefing, adminRun, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        title: { type: string }
        depth: { type: string }
        status: { type: string, description: running / done / failed / cancelled }
        hidden: { type: boolean, description: 已下架 }
        sourceCount: { type: integer }
        wordCount: { type: integer }
        durationSeconds: { type: integer, nullable: true }
        costCny: { type: number, format: double, description: 报告任务和追问的模型成本 }
        rating: { type: string, nullable: true, description: satisfied / unsatisfied }
        reasons:
          type: array
          items: { type: string }
        followups: { type: integer }
        shares: { type: integer }
        shareViews: { type: integer }
        fromBriefing: { type: boolean, description: 从简报条目深入调研 }
        adminRun: { type: boolean, description: 后台重新生成的（不扣额度） }
        regeneratedFrom: { type: string, nullable: true }
        promptVersion: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    ReportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminReportRow' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    ContentFeedback:
      type: object
      required: [rating, reasons, comment, updatedAt]
      properties:
        rating: { type: string }
        reasons:
          type: array
          items: { type: string }
        comment: { type: string }
        updatedAt: { type: string, format: date-time }
    ContentRef:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    AdminReportDetail:
      type: object
      required: [report, topic, focuses, language, summary, markdown, sources, hiddenReason, tasks, shares, regenerations, notes, refunded]
      properties:
        report: { $ref: '#/components/schemas/AdminReportRow' }
        topic: { type: string }
        focuses:
          type: array
          items: { type: string }
        language: { type: string }
        summary: { type: string }
        markdown: { type: string, description: 正文，含追问的回答 }
        sources:
          type: array
          items: { $ref: '#/components/schemas/ContentSource' }
        hiddenReason: { type: string }
        hiddenAt: { type: string, format: date-time, nullable: true }
        sourceBriefingItemId: { type: string, nullable: true }
        tasks:
          type: array
          description: 报告任务和追问，按时间顺序；追问的问题在 input.question
          items: { $ref: '#/components/schemas/TaskDetail' }
        feedback: { $ref: '#/components/schemas/ContentFeedback' }
        shares:
          type: array
          items: { $ref: '#/components/schemas/AdminShare' }
        regenerations:
          type: array
          description: 由这份报告重新生成出的报告
          items: { $ref: '#/components/schemas/ContentRef' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/ContentNote' }
        refunded: { type: boolean, description: 已退还过额度 }
    ContentRunResult:
      type: object
      required: [taskId]
      properties:
        taskId: { type: string }
        reportId: { type: string, description: 重新生成的新报告 }
    HideRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200, description: 给用户看的原因 }
        notify: { type: boolean, default: true, description: 给用户发一条站内信（不推送）；隐藏单条时忽略 }
    RefundResult:
      type: object
      required: [tokens]
      properties:
        tokens: { type: integer, format: int64, description: 退还的 token；0 表示没有可退的 }
        grant: { $ref: '#/components/schemas/QuotaGrant' }
    AdminSubscription:
      type: object
      required: [id, userId, nickname, phoneMasked, name, templateName, topics, scheduleText, length, pushEnabled, status, issues, recent, recentReady, recentRead, recentFailed, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        name: { type: string }
        templateId: { type: string, nullable: true }
        templateName: { type: string }
        templateVersion: { type: integer, nullable: true }
        topics:
          type: array
          items: { type: string }
        fieldValues:
          type: object
          additionalProperties: true
        schedule: { $ref: '#/components/schemas/Schedule' }
        scheduleText: { type: string, description: 如"每天 07:30" }
        length: { type: string }
        pushEnabled: { type: boolean }
        status: { type: string, description: active / paused }
        pausedReason: { type: string, nullable: true, description: user / inactive / account_disabled / admin }
        nextRunAt: { type: string, format: date-time, nullable: true }
        lastOpenedAt: { type: string, format: date-time, nullable: true }
        lastStatus: { type: string, description: 最近一期：ready / failed / generating / empty，空表示还没有 }
        lastDate: { type: string, description: 最近一期日期 YYYY-MM-DD }
        issues: { type: integer, description: 累计期数 }
        recent: { type: integer, description: 近 7 期期数 }
        recentReady: { type: integer }
        recentRead: { type: integer }
        recentFailed: { type: integer, description: 近 3 期失败数 }
        createdAt: { type: string, format: date-time }
    SubscriptionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminSubscription' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    BriefingRunRequest:
      type: object
      properties:
        push: { type: boolean, default: false, description: 生成后给用户推送（用户开着简报推送时） }
    AdminBriefingRow:
      type: object
      required: [id, userId, nickname, phoneMasked, subscriptionId, templateName, title, date, status, hidden, headline, itemCount, sourceCount, costCny, useful, meh, adminRun, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        subscriptionId: { type: string }
        templateId: { type: string, nullable: true }
        templateName: { type: string }
        title: { type: string }
        date: { type: string, format: date }
        status: { type: string, description: generating / ready / failed }
        hidden: { type: boolean }
        headline: { type: string }
        itemCount: { type: integer }
        sourceCount: { type: integer }
        readAt: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        costCny: { type: number, format: double }
        useful: { type: integer, description: 「有用」评价数（含整期和单条） }
        meh: { type: integer, description: 「一般」评价数 }
        adminRun: { type: boolean, description: 当前版本由后台重新生成 }
        generatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    BriefingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBriefingRow' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    AdminBriefingItem:
      type: object
      required: [id, title, summary, sources, useful, meh, comments]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/ContentSource' }
        useful: { type: integer }
        meh: { type: integer }
        comments:
          type: array
          items: { type: string }
    AdminBriefingSection:
      type: object
      required: [key, title, private, masked, items]
      properties:
        key: { type: string }
        title: { type: string }
        private: { type: boolean, description: 含个人信息的区块 }
        masked: { type: boolean, description: 私密区块已打码（items 为空，itemCount 为条目数） }
        itemCount: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBriefingItem' }
    HiddenBriefingItem:
      type: object
      required: [itemId, sectionKey, title, reason, createdAt]
      properties:
        itemId: { type: string }
        sectionKey: { type: string }
        title: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    BriefingRevision:
      type: object
      required: [id, status, headline, itemCount, sourceCount, sections, createdAt]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        headline: { type: string }
        itemCount: { type: integer }
        sourceCount: { type: integer }
        sections:
          type: array
          items: { $ref: '#/components/schemas/AdminBriefingSection' }
        generatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, description: 被覆盖的时间 }
    AdminBriefingDetail:
      type: object
      required: [briefing, sections, privateRevealed, hiddenReason, hiddenItems, revisions, overallFeedback, shares, notes, refunded]
      properties:
        briefing: { $ref: '#/components/schemas/AdminBriefingRow' }
        subscription: { $ref: '#/components/schemas/AdminSubscription' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/AdminBriefingSection' }
        privateRevealed: { type: boolean }
        hiddenReason: { type: string }
        hiddenAt: { type: string, format: date-time, nullable: true }
        hiddenItems:
          type: array
          items: { $ref: '#/components/schemas/HiddenBriefingItem' }
        revisions:
          type: array
          description: 被重新生成覆盖前的版本，最近 10 个
          items: { $ref: '#/components/schemas/BriefingRevision' }
        task: { $ref: '#/components/schemas/TaskDetail' }
        overallFeedback:
          type: array
          description: 对整期的评价（useful / meh）
          items: { type: string }
        shares:
          type: array
          items: { $ref: '#/components/schemas/AdminShare' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/ContentNote' }
        refunded: { type: boolean }
    NoteTargetType:
      type: string
      enum: [report, briefing, subscription]
    ContentNote:
      type: object
      required: [id, targetType, targetId, body, adminName, createdAt]
      properties:
        id: { type: integer, format: int64 }
        targetType: { $ref: '#/components/schemas/NoteTargetType' }
        targetId: { type: string }
        body: { type: string }
        adminName: { type: string }
        createdAt: { type: string, format: date-time }
    ContentNoteInput:
      type: object
      required: [targetType, targetId, body]
      properties:
        targetType: { $ref: '#/components/schemas/NoteTargetType' }
        targetId: { type: string }
        body: { type: string, minLength: 1, maxLength: 2000 }
    ContentIssueKind:
      type: string
      enum: [failed, empty, few_sources, unsatisfied, disliked, costly]
    ContentIssue:
      type: object
      required: [targetType, targetId, kind, title, userId, nickname, phoneMasked, detail, createdAt]
      properties:
        targetType: { type: string, enum: [report, briefing] }
        targetId: { type: string }
        kind: { $ref: '#/components/schemas/ContentIssueKind' }
        title: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        detail: { type: string, description: 来源数 / 不满意原因 / 「一般」条数 / 成本（元） }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedBy: { type: string }
        resolutionNote: { type: string }
    ContentIssuePage:
      type: object
      required: [items, openCounts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContentIssue' }
        openCounts:
          type: object
          description: 各类未处理数量
          additionalProperties: { type: integer }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    ContentIssueResolve:
      type: object
      required: [targetType, targetId, kind]
      properties:
        targetType: { type: string, enum: [report, briefing] }
        targetId: { type: string }
        kind: { $ref: '#/components/schemas/ContentIssueKind' }
        note: { type: string, maxLength: 500 }

    # ------------------------------------------------------------ tasks
    AdminTask:
      type: object
      required: [id, userId, nickname, phoneMasked, kind, status, title, costCny, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        kind: { type: string }
        status: { type: string }
        title: { type: string }
        subtitle: { type: string }
        promptVersion: { type: string }
        reportId: { type: string, nullable: true }
        briefingId: { type: string, nullable: true }
        error:
          type: object
          nullable: true
          additionalProperties: true
        costCny: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    TaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminTask' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    ModelCall:
      type: object
      required: [provider, model, tier, inputTokens, outputTokens, cachedTokens, costCny, createdAt]
      properties:
        provider: { type: string }
        model: { type: string }
        tier: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cachedTokens: { type: integer }
        costCny: { type: number, format: double }
        createdAt: { type: string, format: date-time }
    TaskDetail:
      type: object
      required: [task, input, calls]
      properties:
        task: { $ref: '#/components/schemas/AdminTask' }
        input:
          type: object
          additionalProperties: true
        plan:
          type: object
          nullable: true
          additionalProperties: true
        steps:
          type: array
          description: 任务计划的步骤（简报为各区块，报告为调研步骤）
          items: { $ref: '#/components/schemas/TaskStep' }
        calls:
          type: array
          items: { $ref: '#/components/schemas/ModelCall' }
    TaskStep:
      type: object
      required: [index, title]
      properties:
        index: { type: integer }
        title: { type: string }
        detail: { type: string }
        tool: { type: string }

    # ------------------------------------------------------------ costs
    CostReport:
      type: object
      required: [days, totalCny, daily, byModel, byKind, topUsers, tokenQuota]
      properties:
        days: { type: integer }
        totalCny: { type: number, format: double }
        daily:
          type: array
          items:
            type: object
            required: [date, costCny, inputTokens, outputTokens, calls]
            properties:
              date: { type: string, format: date }
              costCny: { type: number, format: double }
              inputTokens: { type: integer, format: int64 }
              outputTokens: { type: integer, format: int64 }
              calls: { type: integer }
        byModel:
          type: array
          items:
            type: object
            required: [provider, model, tier, calls, inputTokens, outputTokens, costCny, billedTokens]
            properties:
              provider: { type: string }
              model: { type: string }
              tier: { type: string }
              calls: { type: integer }
              inputTokens: { type: integer, format: int64 }
              outputTokens: { type: integer, format: int64 }
              costCny: { type: number, format: double }
              billedTokens: { type: integer, format: int64, description: 按折算系数扣给用户的 token }
              cnyPerMillionBilled:
                type: number
                format: double
                nullable: true
                description: 每百万计费 token 的实际成本；各模型差距大说明折算系数需要调整
        tokenQuota:
          type: object
          description: 本自然月（Asia/Shanghai）免费 token 额度的使用分布，按方案额度计算，不含用户级覆盖与加赠
          required: [periodStart, planLimit, activeUsers, avgTokens, atLimitUsers, buckets]
          properties:
            periodStart: { type: string, format: date }
            planLimit: { type: integer, format: int64 }
            activeUsers: { type: integer, description: 本月有消耗的用户数 }
            avgTokens: { type: integer, format: int64 }
            atLimitUsers: { type: integer, description: 已用满额度的用户数 }
            buckets:
              type: array
              items:
                type: object
                required: [label, users]
                properties:
                  label: { type: string, example: 20–40% }
                  users: { type: integer }
        byKind:
          type: array
          description: 已完成任务按类型的总成本与平均成本
          items:
            type: object
            required: [kind, tasks, costCny, avgCostCny]
            properties:
              kind: { type: string }
              tasks: { type: integer }
              costCny: { type: number, format: double }
              avgCostCny: { type: number, format: double }
        topUsers:
          type: array
          items:
            type: object
            required: [userId, nickname, phoneMasked, tasks, costCny]
            properties:
              userId: { type: string }
              nickname: { type: string }
              phoneMasked: { type: string }
              tasks: { type: integer }
              costCny: { type: number, format: double }

    # ------------------------------------------------------------ model gateway

    # ------------------------------------------------------------ analytics
    # 口径：按北京时间计日；活跃 = 当天打开过 App（带登录态调用过接口），定时简报不算。
    # 2026-10-30 之前的活跃数据由注册日、用户主动发起任务的日子和最后在线日近似回填。
    Kpi:
      type: object
      required: [value]
      properties:
        value: { type: number, format: double }
        previous: { type: number, format: double, nullable: true, description: 上一周期（日指标为昨天，周/月指标为前一个 7/30 天） }
    KeyCount:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }
    RetentionCell:
      type: object
      required: [eligible, retained]
      properties:
        eligible: { type: integer, description: 这一天已经过完的用户数 }
        retained: { type: integer }
    AtRisk:
      type: object
      description: 有定时简报在跑、但近 7 天没打开 App 的用户，以及这 7 天花在他们身上的简报和成本
      required: [users, briefings, costCny]
      properties:
        users: { type: integer }
        briefings: { type: integer }
        costCny: { type: number, format: double }
    AnalyticsOverview:
      type: object
      required: [gateB, kpis, todo, daily, atRisk]
      properties:
        gateB:
          type: object
          required: [d30Retention, reportSatisfaction, reportCost]
          properties:
            d30Retention:
              type: object
              description: 注册后第 29–31 天打开过 App 的比例，取注册日在 31–60 天前的用户（目标 ≥ 20%）
              required: [eligible, retained, cohortFrom, cohortTo, weekly]
              properties:
                rate: { type: number, format: double, nullable: true }
                eligible: { type: integer }
                retained: { type: integer }
                cohortFrom: { type: string, format: date }
                cohortTo: { type: string, format: date }
                weekly:
                  type: array
                  description: 按注册周，最近 8 个已能观察到第 31 天的周
                  items:
                    type: object
                    required: [week, eligible, retained]
                    properties:
                      week: { type: string, format: date }
                      rate: { type: number, format: double, nullable: true }
                      eligible: { type: integer }
                      retained: { type: integer }
            reportSatisfaction:
              type: object
              description: 近 30 天创建的报告（目标 ≥ 70%，评分率 < 25% 时无效）
              required: [satisfied, unsatisfied, completed, weekly]
              properties:
                rate: { type: number, format: double, nullable: true }
                ratingRate: { type: number, format: double, nullable: true }
                satisfied: { type: integer }
                unsatisfied: { type: integer }
                completed: { type: integer }
                weekly:
                  type: array
                  items:
                    type: object
                    required: [week, satisfied, unsatisfied, completed]
                    properties:
                      week: { type: string, format: date }
                      rate: { type: number, format: double, nullable: true }
                      satisfied: { type: integer }
                      unsatisfied: { type: integer }
                      completed: { type: integer }
            reportCost:
              type: object
              description: 近 30 天完成的报告任务的模型成本（目标 ≤ ¥3）
              required: [reports, weekly]
              properties:
                avgCny: { type: number, format: double, nullable: true }
                p90Cny: { type: number, format: double, nullable: true }
                reports: { type: integer }
                weekly:
                  type: array
                  items:
                    type: object
                    required: [week, reports]
                    properties:
                      week: { type: string, format: date }
                      avgCny: { type: number, format: double, nullable: true }
                      reports: { type: integer }
        kpis:
          type: object
          required: [dau, wau, mau, stickiness, newUsers, briefingsRead, reports]
          properties:
            dau: { $ref: '#/components/schemas/Kpi' }
            wau: { $ref: '#/components/schemas/Kpi' }
            mau: { $ref: '#/components/schemas/Kpi' }
            stickiness: { $ref: '#/components/schemas/Kpi' }
            newUsers: { $ref: '#/components/schemas/Kpi' }
            briefingsRead: { $ref: '#/components/schemas/Kpi' }
            reports: { $ref: '#/components/schemas/Kpi' }
        todo:
          type: object
          required: [openFeedback, pendingCampaigns, pendingReleases, failedTasks24h]
          properties:
            openFeedback: { type: integer }
            pendingCampaigns: { type: integer }
            pendingReleases: { type: integer }
            failedTasks24h: { type: integer }
        daily:
          type: array
          description: 近 30 天
          items:
            type: object
            required: [date, activeUsers, newUsers]
            properties:
              date: { type: string, format: date }
              activeUsers: { type: integer }
              newUsers: { type: integer }
        atRisk: { $ref: '#/components/schemas/AtRisk' }
    GrowthSummary:
      type: object
      required: [newUsers, activeUsers, avgDailyActive]
      properties:
        newUsers: { type: integer }
        activeUsers: { type: integer, description: 范围内打开过 App 的去重用户 }
        avgDailyActive: { type: number, format: double }
    AnalyticsGrowth:
      type: object
      required: [from, to, current, previous, daily, platforms, versions, languages, funnel]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        current: { $ref: '#/components/schemas/GrowthSummary' }
        previous: { $ref: '#/components/schemas/GrowthSummary' }
        daily:
          type: array
          items:
            type: object
            required: [date, activeUsers, newUsers, newPhone, newApple, newWechat, newOther, totalUsers]
            properties:
              date: { type: string, format: date }
              activeUsers: { type: integer }
              newUsers: { type: integer }
              newPhone: { type: integer }
              newApple: { type: integer }
              newWechat: { type: integer }
              newOther: { type: integer }
              totalUsers: { type: integer }
        platforms: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        versions: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        languages: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        funnel:
          type: object
          description: 范围内注册的用户；第二周活跃 = 注册后第 7–13 天打开过 App，只算第 13 天已过完的用户
          required: [registered, subscribed, readBriefing, startedReport, week2Eligible, week2Active]
          properties:
            registered: { type: integer }
            subscribed: { type: integer }
            readBriefing: { type: integer }
            startedReport: { type: integer }
            week2Eligible: { type: integer }
            week2Active: { type: integer }
    AnalyticsRetention:
      type: object
      required: [from, to, cohorts, atRisk]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        cohorts:
          type: array
          items:
            type: object
            required: [week, users, d1, d3, d7, d14, d30]
            properties:
              week: { type: string, format: date, description: 注册周的周一 }
              users: { type: integer }
              d1: { $ref: '#/components/schemas/RetentionCell' }
              d3: { $ref: '#/components/schemas/RetentionCell' }
              d7: { $ref: '#/components/schemas/RetentionCell' }
              d14: { $ref: '#/components/schemas/RetentionCell' }
              d30: { $ref: '#/components/schemas/RetentionCell' }
        atRisk: { $ref: '#/components/schemas/AtRisk' }
    BriefingStats:
      type: object
      required: [activeSubscriptions, pausedSubscriptions, newSubscriptions, generated, ready, failed, read, medianReadDelayMinutes, useful, meh, shared]
      properties:
        activeSubscriptions: { type: integer, description: 当前数，不随范围变化 }
        pausedSubscriptions: { type: integer }
        newSubscriptions: { type: integer }
        generated: { type: integer }
        ready: { type: integer }
        failed: { type: integer }
        read: { type: integer }
        medianReadDelayMinutes: { type: number, format: double }
        useful: { type: integer }
        meh: { type: integer }
        shared: { type: integer }
    ReportStats:
      type: object
      required: [started, completed, failed, cancelled, avgDurationSeconds, avgSources, followups, reportsWithFollowup, pdfExports, shared, satisfied, unsatisfied]
      properties:
        started: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        avgDurationSeconds: { type: number, format: double }
        avgSources: { type: number, format: double }
        followups: { type: integer }
        reportsWithFollowup: { type: integer }
        pdfExports: { type: integer }
        shared: { type: integer }
        satisfied: { type: integer }
        unsatisfied: { type: integer }
    AnalyticsEngagement:
      type: object
      required: [from, to, briefings, previousBriefings, briefingsDaily, templates, reports, previousReports, reportsDaily, depths, unsatisfiedReasons, push]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        briefings: { $ref: '#/components/schemas/BriefingStats' }
        previousBriefings: { $ref: '#/components/schemas/BriefingStats' }
        briefingsDaily:
          type: array
          items:
            type: object
            required: [date, generated, read]
            properties:
              date: { type: string, format: date }
              generated: { type: integer }
              read: { type: integer }
        templates:
          type: array
          description: 官方模板，按当前订阅数排序
          items:
            type: object
            required: [id, name, activeSubscriptions, newSubscriptions, briefings, read, useful, meh]
            properties:
              id: { type: string }
              name: { type: string }
              activeSubscriptions: { type: integer }
              newSubscriptions: { type: integer }
              briefings: { type: integer }
              read: { type: integer }
              useful: { type: integer }
              meh: { type: integer }
        reports: { $ref: '#/components/schemas/ReportStats' }
        previousReports: { $ref: '#/components/schemas/ReportStats' }
        reportsDaily:
          type: array
          items:
            type: object
            required: [date, started, completed]
            properties:
              date: { type: string, format: date }
              started: { type: integer }
              completed: { type: integer }
        depths: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        unsatisfiedReasons: { type: array, items: { $ref: '#/components/schemas/KeyCount' } }
        push:
          type: object
          required: [activeUsers, withDevice, briefingPushOn, marketingOptIn, messages, pushed, opened, categories]
          properties:
            activeUsers: { type: integer }
            withDevice: { type: integer, description: 活跃用户中登记了推送设备的 }
            briefingPushOn: { type: integer, description: 其中简报通知开着的 }
            marketingOptIn: { type: integer }
            messages: { type: integer, description: 这些用户在范围内收到的站内消息 }
            pushed: { type: integer }
            opened: { type: integer }
            categories:
              type: array
              items:
                type: object
                required: [category, messages, pushed, opened, read]
                properties:
                  category: { type: string }
                  messages: { type: integer }
                  pushed: { type: integer }
                  opened: { type: integer }
                  read: { type: integer }
    CostSummary:
      type: object
      required: [costCny, billedTokens, activeUsers]
      properties:
        costCny: { type: number, format: double }
        billedTokens: { type: integer, format: int64 }
        activeUsers: { type: integer }
        costPerActiveUserCny: { type: number, format: double, nullable: true }
    AnalyticsCosts:
      type: object
      required: [from, to, current, previous, unitCosts, quota]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        current: { $ref: '#/components/schemas/CostSummary' }
        previous: { $ref: '#/components/schemas/CostSummary' }
        unitCosts:
          type: array
          description: 范围内完成的任务，按类型的单次模型成本
          items:
            type: object
            required: [kind, tasks, costCny, medianCny, p90Cny]
            properties:
              kind: { type: string }
              tasks: { type: integer }
              costCny: { type: number, format: double }
              medianCny: { type: number, format: double }
              p90Cny: { type: number, format: double }
        quota:
          type: object
          description: 本月（北京时间自然月）有用量的用户，用到额度的比例；额度 = 用户覆盖值或默认值 + 本月加赠
          required: [monthStart, defaultLimit, users, over50, over80, exhausted, medianUsed, grantedTokens, grantedUsers]
          properties:
            monthStart: { type: string, format: date }
            defaultLimit: { type: integer, format: int64 }
            users: { type: integer }
            over50: { type: integer }
            over80: { type: integer }
            exhausted: { type: integer }
            medianUsed: { type: number, format: double }
            grantedTokens: { type: integer, format: int64 }
            grantedUsers: { type: integer }
    AnalyticsQuality:
      type: object
      required: [from, to, kinds, errors]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        kinds:
          type: array
          items:
            type: object
            required: [kind, total, done, failed, cancelled, p50Seconds, p90Seconds]
            properties:
              kind: { type: string }
              total: { type: integer }
              done: { type: integer }
              failed: { type: integer }
              cancelled: { type: integer }
              p50Seconds: { type: number, format: double }
              p90Seconds: { type: number, format: double }
        errors:
          type: array
          items:
            type: object
            required: [kind, code, message, count]
            properties:
              kind: { type: string }
              code: { type: string }
              message: { type: string }
              count: { type: integer }

    # ------------------------------------------------------------ provider keys
    ProviderKeyList:
      type: object
      required: [encryptionEnabled, providers, keys]
      properties:
        encryptionEnabled:
          type: boolean
          description: 服务端配置了 ZEUS_SECRETS_KEY；为 false 时不能在后台保存 Key
        providers:
          type: array
          items: { $ref: '#/components/schemas/KeyProvider' }
        keys:
          type: array
          items: { $ref: '#/components/schemas/ProviderKey' }
    KeyProvider:
      type: object
      required: [id, name, kind, apiKeyEnv, envKeyPresent, keySource, inRoute, source, enabled]
      properties:
        id: { type: string, example: qwen }
        name: { type: string, example: 通义千问 }
        kind: { type: string, enum: [llm, search] }
        baseUrl: { type: string }
        apiKeyEnv: { type: string, description: 回退用的环境变量名 }
        envKeyPresent: { type: boolean }
        keySource:
          type: string
          enum: [console, env, none]
        inRoute: { type: boolean, description: 当前是否在用（模型：在「模型路由」的档位顺序或环节指定里，且 ZEUS_LLM_PROVIDER=gateway；搜索：在主用或备用里，且 ZEUS_SEARCH_PROVIDER 不是 mock） }
        source:
          type: string
          enum: [console, builtin]
          description: console = 存在数据库里，可改可停用可删；builtin = 内置的博查搜索（可改可停用，不能删）
        protocol: { type: string, description: 搜索服务商用的接口（bocha / tavily / brave / serper），只有搜索服务商有 }
        searchOrder: { type: integer, nullable: true, description: '搜索顺序：1 = 主用，2 起为备用；不在顺序里为空' }
        imported: { type: boolean, description: 是否从服务端路由文件导入（导入后和后台新增的一样可改） }
        enabled: { type: boolean }
        models: { $ref: '#/components/schemas/ProviderTierModels' }
        timeoutSeconds: { type: integer }
    SearchRouting:
      type: object
      required: [searchProvider, on, chain, protocols, regionalChains]
      properties:
        searchProvider: { type: string, description: 服务端 ZEUS_SEARCH_PROVIDER }
        on: { type: boolean, description: 为 false 时服务端还在用假搜索（mock），这里的设置会先保存 }
        chain:
          type: array
          description: 第一个是主用，其余按顺序作为备用；主用出错时自动换下一个
          items: { type: string }
        regionalChains:
          type: object
          description: 按内容地区覆盖默认链；没配置的地区继承 chain，global 使用默认链
          additionalProperties:
            type: array
            minItems: 1
            maxItems: 5
            items: { type: string }
        protocols:
          type: array
          items: { $ref: '#/components/schemas/SearchProtocol' }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, description: 最后修改人邮箱 }
    SearchProtocol:
      type: object
      required: [id, name, defaultBaseUrl, region, docsUrl]
      properties:
        id: { type: string, example: tavily }
        name: { type: string, example: Tavily }
        defaultBaseUrl: { type: string }
        region: { type: string, description: 适用范围说明 }
        docsUrl: { type: string }
    SearchRoutingInput:
      type: object
      required: [chain]
      properties:
        chain:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string }
        regionalChains:
          type: object
          description: 完整替换地区覆盖；省略则保留，空对象清除覆盖
          additionalProperties:
            type: array
            minItems: 1
            maxItems: 5
            items: { type: string }
    SearchProviderInput:
      type: object
      required: [id, name, protocol]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$', description: '服务商标识，如 tavily；创建后不能改' }
        name: { type: string, minLength: 1, maxLength: 40, description: 显示名称 }
        protocol: { type: string, enum: [bocha, tavily, brave, serper] }
        baseUrl: { type: string, maxLength: 300, description: 不填用该接口的默认地址 }
        apiKey: { type: string, minLength: 8, maxLength: 512, description: '可同时保存一把 Key 并启用' }
        addToChain: { type: boolean, default: false, description: 加到搜索顺序末尾作为备用 }
    SearchProviderUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        baseUrl: { type: string, maxLength: 300, description: 空字符串表示用默认地址 }
        enabled: { type: boolean }
    ProviderKey:
      type: object
      required: [id, provider, label, last4, baseUrl, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        label: { type: string }
        last4: { type: string, description: Key 末 4 位，明文不返回 }
        baseUrl: { type: string, description: 和这把 Key 一起保存的 API 地址；空表示用服务商默认地址 }
        active: { type: boolean }
        createdBy: { type: string, description: 创建人邮箱 }
        createdAt: { type: string, format: date-time }
        lastTestedAt: { type: string, format: date-time, nullable: true }
        lastTestOk: { type: boolean, nullable: true }
        lastTestMessage: { type: string }
        lastTestLatencyMs: { type: integer, nullable: true }
    ModelProviderInput:
      type: object
      required: [id, name, baseUrl, models]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$', description: '服务商标识，小写字母、数字和连字符，如 moonshot；创建后不能改' }
        name: { type: string, minLength: 1, maxLength: 40, description: 显示名称 }
        baseUrl: { type: string, maxLength: 300, description: 'OpenAI 兼容接口地址，到 /v1 这一级' }
        models: { $ref: '#/components/schemas/ProviderTierModels' }
        timeoutSeconds: { type: integer, minimum: 10, maximum: 600, default: 120 }
        apiKey: { type: string, minLength: 8, maxLength: 512, description: '可同时保存一把 Key 并启用' }
    ModelProviderUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        baseUrl: { type: string, maxLength: 300 }
        models: { $ref: '#/components/schemas/ProviderTierModels' }
        timeoutSeconds: { type: integer, minimum: 10, maximum: 600 }
        enabled: { type: boolean, description: 停用后网关不再调用，「模型指定」里也不能选 }
    ProviderTierModels:
      type: object
      description: 各档位的默认模型；在「模型指定」里没写模型名时用
      properties:
        strong: { type: string, maxLength: 100 }
        fast: { type: string, maxLength: 100 }
    ProviderKeyInput:
      type: object
      required: [provider, apiKey]
      properties:
        provider: { type: string }
        label: { type: string, maxLength: 50 }
        apiKey: { type: string, minLength: 8, maxLength: 512 }
        baseUrl: { type: string, maxLength: 300, description: 'API 地址，如百炼业务空间专属地址；不填用默认地址' }
        activate: { type: boolean, default: true }
    KeyTestParams:
      type: object
      description: 测试调用的参数，都可不填：模型默认用快档模型、提示词 ping、最多 1 个 token；搜索默认查“今日新闻”1 条
      properties:
        model: { type: string, maxLength: 100 }
        system: { type: string, maxLength: 4000 }
        prompt: { type: string, maxLength: 4000 }
        maxTokens: { type: integer, minimum: 1, maximum: 2048 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        json: { type: boolean, description: 要求模型返回 JSON（response_format=json_object） }
        query: { type: string, maxLength: 200 }
        count: { type: integer, minimum: 1, maximum: 10 }
    ProviderKeyTest:
      type: object
      required: [ok, message, latencyMs]
      properties:
        ok: { type: boolean }
        message: { type: string }
        latencyMs: { type: integer }
        model: { type: string, description: 实际应答的模型 }
        reply: { type: string, description: 模型回复（最多 4000 字） }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        results:
          type: array
          description: 搜索结果
          items:
            type: object
            required: [title, url]
            properties:
              title: { type: string }
              url: { type: string }

    # ------------------------------------------------------------ model routing
    ModelRouting:
      type: object
      description: |
        路由存在数据库里（首次启动时从服务端路由文件导入一次）。configured=false 表示还没有路由，
        需要先保存档位顺序；gatewayOn=false 表示服务端还在用假模型，这里的设置会先保存。
      required: [llmProvider, gatewayOn, configured, importedFromFile, providers, tiers, purposes, breaker, usage24h, versions]
      properties:
        llmProvider: { type: string }
        gatewayOn: { type: boolean, description: 'ZEUS_LLM_PROVIDER=gateway' }
        configured: { type: boolean }
        importedFromFile: { type: boolean, description: 当前路由最初是从路由文件导入的 }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        catalog: { $ref: '#/components/schemas/ModelCatalog' }
        providers:
          type: array
          description: 启用中的模型服务商
          items: { $ref: '#/components/schemas/ModelProviderOption' }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/TierRoute' }
        purposes:
          type: array
          items: { $ref: '#/components/schemas/PurposeRoute' }
        breaker: { $ref: '#/components/schemas/BreakerSettings' }
        usage24h:
          type: array
          items:
            type: object
            required: [provider, calls, costCny]
            properties:
              provider: { type: string }
              calls: { type: integer }
              costCny: { type: number, format: double }
              lastCallAt: { type: string, format: date-time, nullable: true }
        versions:
          type: array
          description: 最近的历史版本，新的在前；第一条是当前版本
          items: { $ref: '#/components/schemas/RoutingVersion' }
    ModelProviderOption:
      type: object
      required: [name, displayName, keyPresent, models, bailian]
      properties:
        name: { type: string }
        displayName: { type: string }
        keyPresent: { type: boolean }
        bailian: { type: boolean, description: '百炼（DashScope）地址：可从模型目录选模型，价格取「模型定价」' }
        timeoutSeconds: { type: integer, minimum: 10, maximum: 600, description: 服务商调用超时，作用于所有使用该服务商的路由 }
        models:
          type: object
          description: 服务商各档位的默认模型
          additionalProperties: { type: string }
    ModelCatalog:
      type: object
      description: 百炼文本模型目录（随服务端发布，价格单位 元 / 百万 token；分档计价的模型没有 price）
      required: [source, updated, models]
      properties:
        source: { type: string }
        updated: { type: string }
        models:
          type: array
          items:
            type: object
            required: [model, vendor, contextWindow]
            properties:
              model: { type: string }
              vendor: { type: string }
              contextWindow: { type: integer }
              price: { $ref: '#/components/schemas/ModelPrice' }
    RouteStep:
      type: object
      required: [provider, model, usesDefault, available, keyPresent, priced]
      properties:
        provider: { type: string }
        model: { type: string, description: 实际调用的模型 }
        usesDefault: { type: boolean, description: 没有单独选模型，用服务商这一档的默认模型 }
        available: { type: boolean, description: 服务商存在且启用；否则调用时会跳过 }
        keyPresent: { type: boolean }
        priced: { type: boolean, description: 「模型定价」里有价格（或百炼目录有），成本能算出来 }
        price: { $ref: '#/components/schemas/ModelPrice' }
    RouteStepInput:
      type: object
      required: [provider]
      properties:
        provider: { type: string }
        model: { type: string, maxLength: 100, description: 不填用服务商这一档的默认模型 }
    TierRoute:
      type: object
      required: [tier, steps]
      properties:
        tier: { type: string, enum: [strong, fast] }
        steps:
          type: array
          description: 依次尝试，第一个是首选
          items: { $ref: '#/components/schemas/RouteStep' }
    PurposeRoute:
      type: object
      required: [scope, tier, effective]
      properties:
        scope: { type: string }
        tier: { type: string, enum: [strong, fast] }
        override: { $ref: '#/components/schemas/ModelOverride' }
        effective:
          type: array
          description: 实际调用顺序：指定的模型（如有），再按所在档位的顺序
          items: { $ref: '#/components/schemas/RouteStep' }
    BreakerSettings:
      type: object
      required: [failures, cooldownSeconds]
      properties:
        failures: { type: integer, description: 连续失败几次后暂停这个服务商 }
        cooldownSeconds: { type: integer, description: 暂停多少秒 }
    RoutingSettingsInput:
      type: object
      required: [routes, breaker]
      properties:
        routes:
          type: object
          required: [strong, fast]
          properties:
            strong:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RouteStepInput' }
            fast:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RouteStepInput' }
        breaker: { $ref: '#/components/schemas/BreakerSettings' }
    RoutingVersion:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        action:
          type: string
          description: 'import = 从路由文件导入；settings = 改档位顺序或熔断；purpose = 改环节；restore = 恢复历史版本'
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ModelPriceTier:
      type: object
      required: [name, price]
      properties:
        name: { type: string, description: '档位说明，如 ≤128K；单一价格时为空' }
        maxTokens: { type: integer, description: '这一档输入 token 上限' }
        price: { $ref: '#/components/schemas/ModelPrice' }
    ModelPriceRow:
      type: object
      required: [model, vendor, contextWindow, tiers, origin, stale, usedBy, note]
      properties:
        model: { type: string }
        vendor: { type: string }
        contextWindow: { type: integer }
        tiers:
          type: array
          description: 百炼标价（同步或内置目录）；多档时计费按第一档
          items: { $ref: '#/components/schemas/ModelPriceTier' }
        manual: { $ref: '#/components/schemas/ModelPrice' }
        metered: { $ref: '#/components/schemas/ModelPrice' }
        origin:
          type: string
          enum: [manual, synced, builtin, none]
          description: 计费价格的来源：手动 / 同步自百炼 / 服务端内置目录 / 没有价格
        stale: { type: boolean, description: '最近一次同步里百炼已不再列出这个模型' }
        usedBy:
          type: array
          description: 「模型路由」里用到这个模型的档位或环节
          items: { type: string }
        note: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ModelPriceList:
      type: object
      required: [source, builtinUpdated, models]
      properties:
        source:
          type: string
          enum: [synced, builtin]
          description: synced = 用的是最近一次从百炼同步的价格；builtin = 还没同步过，用服务端内置目录
        syncedAt: { type: string, format: date-time }
        builtinUpdated: { type: string }
        models:
          type: array
          items: { $ref: '#/components/schemas/ModelPriceRow' }
    ModelPriceSyncResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        count: { type: integer }
        added: { type: integer }
        changed:
          type: array
          description: 标价变了的模型
          items: { type: string }
    ModelPrice:
      type: object
      description: 元 / 百万 token
      required: [input, output, cached]
      properties:
        input: { type: number, minimum: 0 }
        output: { type: number, minimum: 0 }
        cached: { type: number, minimum: 0 }
    ModelOverride:
      type: object
      required: [provider, model, updatedAt]
      properties:
        provider: { type: string }
        model: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ModelOverrideInput:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string }
        model: { type: string, minLength: 1, maxLength: 100 }

    # ------------------------------------------------------------ feedback
    Satisfaction:
      type: object
      description: |
        报告满意度 = satisfied ÷ (satisfied + unsatisfied)，按报告创建日落窗口；评分率 = 已评 ÷ completed。
        门槛 B 要求满意度 ≥ 70%，评分率低于 25% 时结论无效。
      required: [reports7d, reports30d, briefings30d, openFeedback, unsatisfiedReasons30d]
      properties:
        reports7d: { $ref: '#/components/schemas/ReportRatingCounts' }
        reports30d: { $ref: '#/components/schemas/ReportRatingCounts' }
        briefings30d:
          type: object
          description: 简报整期评分（不含单条）
          required: [useful, meh]
          properties:
            useful: { type: integer }
            meh: { type: integer }
        openFeedback:
          type: integer
          description: 待处理 + 处理中的意见反馈
        unsatisfiedReasons30d:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { $ref: '#/components/schemas/ReportFeedbackReason' }
              count: { type: integer }
    ReportRatingCounts:
      type: object
      required: [completed, satisfied, unsatisfied]
      properties:
        completed: { type: integer, description: 窗口内创建且已完成的报告数 }
        satisfied: { type: integer }
        unsatisfied: { type: integer }
    FeedbackType:
      type: string
      enum: [bug, suggestion, other]
    FeedbackStatus:
      type: string
      enum: [new, in_progress, resolved, closed]
    ReportFeedbackReason:
      type: string
      description: 内容不准确 / 不够深入 / 来源不可靠 / 没回答我的问题 / 生成太慢 / 其他
      enum: [inaccurate, shallow, bad_sources, off_topic, slow, other]
    FeedbackSummary:
      type: object
      required: [id, userId, nickname, phoneMasked, type, content, status, flagged, attachmentCount, replyCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        type: { $ref: '#/components/schemas/FeedbackType' }
        content: { type: string }
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        flagged:
          type: boolean
          description: 命中审核关键词（仅标记，不拦截）
        appVersion: { type: string }
        attachmentCount: { type: integer }
        replyCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedbackSummary' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    FeedbackDetail:
      allOf:
        - $ref: '#/components/schemas/FeedbackSummary'
        - type: object
          required: [contact, client, flaggedReason, adminNote, attachments, replies]
          properties:
            contact: { type: string }
            client:
              type: object
              description: App 版本、系统、机型等，原样保存
              additionalProperties: true
            reportId: { type: string, nullable: true }
            taskId: { type: string, nullable: true }
            flaggedReason: { type: string }
            adminNote: { type: string }
            handledBy: { type: string, nullable: true, description: 最后处理人邮箱 }
            lastReplyAt: { type: string, format: date-time, nullable: true }
            userReadAt:
              type: string
              format: date-time
              nullable: true
              description: 用户最后一次打开这条反馈的时间
            attachments:
              type: array
              items:
                type: object
                required: [id, url]
                properties:
                  id: { type: string }
                  url: { type: string, description: 短时签名链接 }
            replies:
              type: array
              items:
                type: object
                required: [id, content, createdAt]
                properties:
                  id: { type: string }
                  content: { type: string }
                  adminName: { type: string }
                  createdAt: { type: string, format: date-time }
    FeedbackPatch:
      type: object
      properties:
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        adminNote: { type: string, maxLength: 2000 }
    FeedbackReplyRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 1000 }
    ReportFeedbackItem:
      type: object
      required: [reportId, reportTitle, reportDepth, userId, nickname, phoneMasked, rating, reasons, comment, reportCreatedAt, updatedAt]
      properties:
        reportId: { type: string }
        reportTitle: { type: string }
        reportDepth: { type: string }
        taskId: { type: string, nullable: true }
        userId: { type: string }
        nickname: { type: string }
        phoneMasked: { type: string }
        rating: { type: string, enum: [satisfied, unsatisfied] }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/ReportFeedbackReason' }
        comment: { type: string }
        reportCreatedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReportFeedbackPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportFeedbackItem' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ campaigns
    CampaignStatus:
      type: string
      description: draft 草稿 → pending_approval 待审批 → scheduled 已排期 → sending 发送中 → sent 已发送；cancelled 已取消、recalled 已撤回
      enum: [draft, pending_approval, scheduled, sending, sent, cancelled, recalled]
    CampaignCategory:
      type: string
      description: marketing 运营活动（只推给开启了运营推送的用户，受频控）；service 服务通知（如停机公告）
      enum: [marketing, service]
    CampaignAudience:
      type: object
      required: [type]
      description: |
        all 全部用户；users 指定 userIds（最多 10000）；filter 按条件，所有已填条件同时满足。停用的用户始终排除。
      properties:
        type: { type: string, enum: [all, users, filter] }
        userIds:
          type: array
          items: { type: string }
        registeredAfter: { type: string, format: date-time }
        registeredBefore: { type: string, format: date-time }
        activeWithinDays: { type: integer, minimum: 0, maximum: 365, description: 最近 N 天打开过 App }
        inactiveForDays: { type: integer, minimum: 0, maximum: 365, description: 超过 N 天没打开 App }
        minAppVersion: { type: string, example: '1.2.0' }
        templateId: { type: string, description: 有用该模板创建的进行中简报订阅 }
        language: { type: string, enum: [zh, zh-Hant, en], description: App 显示语言；不填表示不限 }
        platform:
          type: string
          enum: [ios, android]
          description: 有该平台的推送设备；和 minAppVersion 同时填时，版本按该平台的设备比较。不填表示不限
    CampaignInput:
      type: object
      required: [name, category, title, body, audience]
      properties:
        name: { type: string, description: 内部名称，用户看不到 }
        category: { $ref: '#/components/schemas/CampaignCategory' }
        title: { type: string, maxLength: 40 }
        body: { type: string, maxLength: 200 }
        titleEn: { type: string, maxLength: 80, description: 英文标题，选填；显示语言为英文的用户收到英文，未填则收中文 }
        bodyEn: { type: string, maxLength: 400 }
        imageUrl: { type: string, description: https 图片，推送大图和消息中心都会显示 }
        deeplink: { type: string, description: 'zeus:// 页面或 https 链接，空表示只打开 App' }
        audience: { $ref: '#/components/schemas/CampaignAudience' }
        sendAt: { type: string, format: date-time, nullable: true, description: 定时发送；为空表示审批通过后立即发送 }
    CampaignStats:
      type: object
      required: [messages, pushed, pushFailed, pushSkipped, pushPending, read, opened]
      properties:
        messages: { type: integer, description: 写入消息中心的人数 }
        pushed: { type: integer, description: APNs 推送成功 }
        pushFailed: { type: integer }
        pushSkipped: { type: integer, description: 用户关闭、频控或没有设备 }
        pushPending: { type: integer, description: 免打扰延后中 }
        read: { type: integer, description: 在消息中心或通过推送看过 }
        opened: { type: integer, description: 点推送打开 App }
    Campaign:
      type: object
      required: [id, name, category, title, body, imageUrl, deeplink, audience, status, audienceEstimate, rejectReason, stats, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/CampaignCategory' }
        title: { type: string }
        body: { type: string }
        titleEn: { type: string }
        bodyEn: { type: string }
        imageUrl: { type: string }
        deeplink: { type: string }
        audience: { $ref: '#/components/schemas/CampaignAudience' }
        sendAt: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        audienceEstimate: { type: integer, description: 提交时估算的目标人数 }
        rejectReason: { type: string }
        createdBy: { type: string, description: 创建人邮箱 }
        approvedBy: { type: string, description: 审批人邮箱 }
        submittedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        recalledAt: { type: string, format: date-time }
        stats: { $ref: '#/components/schemas/CampaignStats' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CampaignPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Campaign' }
        nextCursor: { $ref: '#/components/schemas/NextCursor' }
    AudienceEstimate:
      type: object
      required: [count]
      properties:
        count: { type: integer }
    CampaignRejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 200 }
    CampaignTestRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string }
    CampaignTestResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [userId, status]
            properties:
              userId: { type: string }
              status: { type: string, enum: [sent, no_device, failed, not_found] }
    ConfigNamespace:
      type: string
      enum: [feature, ui, quota, endpoint, killswitch, app]
    ConfigValueType:
      type: string
      enum: [bool, int, float, string, json]
    ConfigApplyMode:
      type: string
      enum: [immediate, next_launch]
    ConfigCondition:
      type: object
      required: [attr, op, values]
      properties:
        attr:
          type: string
          enum: [user_id, app_version, platform, os_version, plan, region, locale, channel, registered_at]
        op:
          type: string
          enum: [eq, neq, in, not_in, semver_gte, semver_lt, before, after]
          description: semver_* 只用于 app_version / os_version；before / after 只用于 registered_at（日期 2026-10-24）
        values:
          type: array
          items: { type: string }
    ConfigRollout:
      type: object
      required: [percent, value]
      properties:
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: 命中条件的用户中按 sha256(salt:user_id) 分桶放量的比例，精度 0.01
        value:
          nullable: true
          description: 放量部分拿到的值
        salt:
          type: string
          description: 默认等于 key；改了会重新洗牌
    ConfigRule:
      type: object
      required: [id, when]
      description: 自上而下匹配，第一条命中的生效。value 与 rollout 二选一；rollout 没抽中的继续往下匹配
      properties:
        id: { type: string, example: r1 }
        note: { type: string }
        when:
          type: array
          description: 全部满足才命中；空数组表示所有人
          items: { $ref: '#/components/schemas/ConfigCondition' }
        value:
          nullable: true
        rollout: { $ref: '#/components/schemas/ConfigRollout' }
    ConfigKeyState:
      type: object
      description: 一个配置项在某个版本里的内容
      required: [namespace, type, defaultValue, rules, applyMode, clientVisible, expose]
      properties:
        namespace: { $ref: '#/components/schemas/ConfigNamespace' }
        type: { $ref: '#/components/schemas/ConfigValueType' }
        defaultValue:
          nullable: true
        rules:
          type: array
          items: { $ref: '#/components/schemas/ConfigRule' }
        applyMode: { $ref: '#/components/schemas/ConfigApplyMode' }
        clientVisible: { type: boolean }
        expose: { type: boolean }
    ConfigKey:
      type: object
      required: [key, namespace, type, description, owner, defaultValue, rules, applyMode, clientVisible, expose, archived, unpublished, createdAt, updatedAt]
      properties:
        key: { type: string }
        namespace: { $ref: '#/components/schemas/ConfigNamespace' }
        type: { $ref: '#/components/schemas/ConfigValueType' }
        description: { type: string }
        owner: { type: string, description: 负责人 }
        defaultValue:
          nullable: true
        valueSchema:
          type: object
          nullable: true
          additionalProperties: true
          description: json 类型的 JSON Schema
        rules:
          type: array
          items: { $ref: '#/components/schemas/ConfigRule' }
        applyMode: { $ref: '#/components/schemas/ConfigApplyMode' }
        clientVisible: { type: boolean, description: false 表示只给服务端读，不下发到 App }
        expose: { type: boolean, description: App 读取时上报 config_exposure }
        archived: { type: boolean }
        unpublished: { type: boolean, description: 工作副本和线上版本不同 }
        published:
          $ref: '#/components/schemas/ConfigKeyState'
        updatedByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConfigKeyList:
      type: object
      required: [items, publishedVersion]
      properties:
        publishedVersion: { type: integer, format: int64, description: 线上版本号，0 表示还没有发布过 }
        pendingReleaseId: { type: integer, format: int64, description: 待审批的发布 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigKey' }
    ConfigKeyCreate:
      type: object
      required: [key, namespace, type, defaultValue]
      properties:
        key: { type: string, example: briefing.new_card_layout }
        namespace: { $ref: '#/components/schemas/ConfigNamespace' }
        type: { $ref: '#/components/schemas/ConfigValueType' }
        description: { type: string }
        owner: { type: string }
        defaultValue:
          nullable: true
        valueSchema:
          type: object
          nullable: true
          additionalProperties: true
        applyMode: { $ref: '#/components/schemas/ConfigApplyMode' }
        clientVisible: { type: boolean, default: true }
        expose: { type: boolean, default: false }
    ConfigKeyPatch:
      type: object
      properties:
        namespace: { $ref: '#/components/schemas/ConfigNamespace' }
        description: { type: string }
        owner: { type: string }
        defaultValue:
          nullable: true
          description: 不传表示不改；json 类型要改成 null 时传 defaultValueNull=true
        defaultValueNull: { type: boolean }
        valueSchema:
          type: object
          additionalProperties: true
        clearValueSchema: { type: boolean }
        rules:
          type: array
          items: { $ref: '#/components/schemas/ConfigRule' }
        applyMode: { $ref: '#/components/schemas/ConfigApplyMode' }
        clientVisible: { type: boolean }
        expose: { type: boolean }
        archived: { type: boolean }
    ConfigChange:
      type: object
      required: [key, kind]
      properties:
        key: { type: string }
        kind:
          type: string
          enum: [added, removed, changed]
        before: { $ref: '#/components/schemas/ConfigKeyState' }
        after: { $ref: '#/components/schemas/ConfigKeyState' }
    ConfigChanges:
      type: object
      required: [publishedVersion, changes, publishesDirectly]
      properties:
        publishedVersion: { type: integer, format: int64 }
        publishesDirectly:
          type: boolean
          description: 当前管理员提交这些改动会不会直接上线（不需要审批）
        changes:
          type: array
          items: { $ref: '#/components/schemas/ConfigChange' }
    ConfigReleaseStatus:
      type: string
      enum: [pending, published, rejected, superseded]
    ConfigRelease:
      type: object
      required: [id, status, note, createdByEmail, decidedByEmail, decisionNote, createdAt]
      properties:
        id: { type: integer, format: int64 }
        version: { type: integer, format: int64, description: 只有已发布的有 }
        status: { $ref: '#/components/schemas/ConfigReleaseStatus' }
        note: { type: string }
        rolledBackFrom: { type: integer, format: int64, description: 回滚来源的发布 id }
        createdByEmail: { type: string }
        decidedByEmail: { type: string }
        decisionNote: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        current: { type: boolean, description: 是当前线上版本 }
    ConfigReleasePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigRelease' }
        nextCursor: { type: string }
    ConfigReleaseDetail:
      allOf:
        - $ref: '#/components/schemas/ConfigRelease'
        - type: object
          required: [changes, baseVersion]
          properties:
            baseVersion: { type: integer, format: int64, description: changes 的比较基准版本，0 表示空 }
            changes:
              type: array
              items: { $ref: '#/components/schemas/ConfigChange' }
    ConfigReleaseRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }
    ConfigPreviewRequest:
      type: object
      properties:
        source:
          type: string
          enum: [published, working]
          default: published
          description: working 用工作副本预览尚未发布的规则
        userId: { type: string }
        phone: { type: string, description: 与 userId 二选一 }
        installId: { type: string }
        appVersion: { type: string }
        platform: { type: string, default: ios }
        osVersion: { type: string }
        channel: { type: string }
        locale: { type: string }
    ConfigPreviewValue:
      type: object
      required: [key, value, isDefault, clientVisible]
      properties:
        key: { type: string }
        value:
          nullable: true
        ruleId: { type: string }
        isDefault: { type: boolean }
        clientVisible: { type: boolean }
    ConfigPreview:
      type: object
      required: [version, values]
      properties:
        version: { type: integer, format: int64, description: 预览所用的版本，working 时为 0 }
        userId: { type: string }
        plan: { type: string }
        values:
          type: array
          items: { $ref: '#/components/schemas/ConfigPreviewValue' }

    ExternalCall:
      type: object
      required: [id, groupId, attempt, kind, provider, model, protocol, purpose, origin, region, dispatched, status, startedAt, deadlineAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid, description: 同一次逻辑请求的主备尝试共享该标识 }
        attempt: { type: integer }
        kind: { type: string }
        provider: { type: string }
        model: { type: string, description: 请求的模型 }
        responseModel: { type: string, description: 实际返回的模型 }
        protocol: { type: string }
        purpose: { type: string }
        origin: { type: string, description: app / system / admin_test }
        taskId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        region: { type: string }
        query: { type: string, description: 搜索词，最多 400 字；不保存模型提示词 }
        dispatched: { type: boolean, description: false 表示跳过，没有发出请求 }
        status: { type: string, description: running / success / empty / failed / timeout / cancelled / skipped / unknown }
        errorCode: { type: string }
        requestId: { type: string }
        httpStatus: { type: integer }
        inputTokens: { type: integer, nullable: true, description: 缺失或 null 表示未获得真实用量 }
        outputTokens: { type: integer, nullable: true }
        cachedTokens: { type: integer, nullable: true }
        resultCount: { type: integer, nullable: true }
        startedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true }
    ExternalCallList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExternalCall' }
        nextCursor: { type: string, nullable: true }
