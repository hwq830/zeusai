{{- if .Values.migrate.enabled }}
# Runs before the new pods roll out, on install and on every upgrade. Only env is needed:
# migrations, official templates, the connector catalog and config keys are in the binary.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zeus.fullname" . }}-migrate
  labels: {{- include "zeus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "zeus.selector" (dict "root" $ "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext: {{- include "zeus.podSecurityContext" . | nindent 8 }}
      {{- include "zeus.scheduling" . | nindent 6 }}
      # zeusctl runs one command per invocation and distroless has no shell: migrate as the
      # init container, then seed.
      initContainers:
        {{- include "zeus.zeusctl" (dict "root" $ "cmd" "migrate") | nindent 8 }}
      containers:
        {{- include "zeus.zeusctl" (dict "root" $ "cmd" "seed") | nindent 8 }}
{{- end }}

