name: server

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'api/**'
      - 'server/**'
      - 'sandbox/**'
      - 'prompts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/server.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zeus
          POSTGRES_PASSWORD: zeus
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zeus" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      ZEUS_TEST_DATABASE_URL: postgres://zeus:zeus@localhost:5432/postgres?sslmode=disable
      ZEUS_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          go generate ./server/...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
