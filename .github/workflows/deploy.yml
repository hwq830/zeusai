name: deploy

# Builds the server images on every PR that touches them and checks the Helm chart. On main
# and on v* tags the images are pushed to the registry in the ACR_REGISTRY variable (e.g.
# registry.cn-hangzhou.aliyuncs.com/zeus) with secrets ACR_USERNAME / ACR_PASSWORD; without
# them the push step is skipped.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'server/**'
      - 'prompts/**'
      - 'web/report-template/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/docker/**'
      - 'deploy/helm/**'
      - '.github/workflows/deploy.yml'

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and validate
        run: |
          helm lint deploy/helm/zeus
          helm template zeus deploy/helm/zeus --kube-version 1.31.0 > /tmp/zeus.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary -kubernetes-version 1.31.0 /tmp/zeus.yaml

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server, orchestrator]
    env:
      PUSH: ${{ github.event_name == 'push' && vars.ACR_REGISTRY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: tags
        run: |
          repo="${{ vars.ACR_REGISTRY || 'zeus' }}/zeus-${{ matrix.target }}"
          tags="$repo:sha-${GITHUB_SHA::12}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then tags="$tags,$repo:${GITHUB_REF_NAME#v}"; fi
          if [[ $GITHUB_REF == refs/heads/main ]]; then tags="$tags,$repo:main"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }},ignore-error=true
      - name: Smoke-test the image
        if: env.PUSH != 'true'
        run: |
          img=$(cut -d, -f1 <<<"${{ steps.tags.outputs.tags }}")
          docker run --rm --entrypoint /usr/local/bin/zeusctl "$img" 2>&1 | grep -q usage
          if [[ ${{ matrix.target }} == orchestrator ]]; then
            docker run --rm --entrypoint /usr/bin/chromium "$img" --headless --no-sandbox --disable-gpu --print-to-pdf=/tmp/x.pdf 'data:text/html,<p>中文</p>'
          fi
