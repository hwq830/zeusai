slug: tech-morning
name: 科技早报
description: 每天早上一份科技圈要闻，外加你关注的公司和话题
category: 行业资讯
icon: newspaper
sort_order: 10
fields:
  - key: topics
    label: 关注的话题
    type: tags
    required: false
    placeholder: 如 大模型、芯片、新能源车
    max: 8
  - key: companies
    label: 关注的公司
    type: tags
    required: false
    placeholder: 如 苹果、比亚迪
    max: 8
sections:
  - key: headlines
    title: 今日要闻
    instruction: 科技行业当天最重要的 3–5 件事
    max_items: 5
  - key: topics
    title: 你关注的话题
    instruction: 围绕 {{topics}} 的最新进展
    max_items: 5
  - key: companies
    title: 公司动态
    instruction: '{{companies}} 的新闻、财报、产品发布'
    max_items: 5
sources:
  - type: search
    value: 科技 新闻 今日
  - type: search
    value: '{{topics}} 最新进展'
  - type: search
    value: '{{companies}} 最新消息'
# 按地区替换上面的 sources（台港澳的搜索词会自动转成繁体）。没写的地区用默认 sources。
market_sources:
  TW:
    - { type: site, value: ithome.com.tw }
    - { type: site, value: bnext.com.tw }
    - { type: site, value: technews.tw }
    - { type: search, value: 科技 新闻 今日 }
    - { type: search, value: '{{topics}} 最新进展' }
    - { type: search, value: '{{companies}} 最新消息' }
  HK: &tech_hk
    - { type: site, value: unwire.hk }
    - { type: site, value: ezone.hk }
    - { type: search, value: 科技 新闻 今日 }
    - { type: search, value: '{{topics}} 最新进展' }
    - { type: search, value: '{{companies}} 最新消息' }
  MO: *tech_hk
  SG:
    - { type: site, value: techinasia.com }
    - { type: site, value: e27.co }
    - { type: search, value: 科技 新闻 今日 }
    - { type: search, value: '{{topics}} 最新进展' }
    - { type: search, value: '{{companies}} 最新消息' }
  MY:
    - { type: site, value: digitalnewsasia.com }
    - { type: site, value: techinasia.com }
    - { type: search, value: 科技 新闻 今日 }
    - { type: search, value: '{{topics}} 最新进展' }
    - { type: search, value: '{{companies}} 最新消息' }
  US:
    - { type: site, value: techcrunch.com }
    - { type: site, value: theverge.com }
    - { type: site, value: arstechnica.com }
    - { type: search, value: tech news today }
    - { type: search, value: '{{topics}} latest' }
    - { type: search, value: '{{companies}} news' }
default_schedule: { freq: daily, time: '08:00', tz: Asia/Shanghai }
default_length: standard
translations:
  en:
    name: Tech Morning
    description: The top tech stories every morning, plus the companies and topics you follow
    category: Industry news
    fields:
      topics: { label: Topics, placeholder: 'e.g. LLMs, chips, EVs' }
      companies: { label: Companies, placeholder: 'e.g. Apple, BYD' }
    sections:
      headlines: { title: Top stories, instruction: The 3–5 most important things in tech today }
      topics: { title: Your topics, instruction: 'Latest on {{topics}}' }
      companies: { title: Company news, instruction: 'News, earnings and product launches from {{companies}}' }
