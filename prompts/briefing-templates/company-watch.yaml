slug: company-watch
name: 公司追踪
description: 盯住几家公司：新闻、公告、产品和高管动向
category: 商业财经
icon: building.2
sort_order: 20
fields:
  - key: companies
    label: 要追踪的公司
    type: tags
    required: true
    placeholder: 如 宁德时代、英伟达
    max: 5
  - key: aspects
    label: 侧重
    type: multiselect
    required: false
    options: [财报与业绩, 产品发布, 融资并购, 高管变动, 监管与诉讼]
sections:
  - key: news
    title: 重要新闻
    instruction: '{{companies}} 的重大新闻，侧重 {{aspects}}'
    max_items: 6
  - key: filings
    title: 公告与财报
    instruction: 上市公司公告、财报数据，给出关键数字
    max_items: 4
sources:
  - type: search
    value: '{{companies}} 新闻'
  - type: search
    value: '{{companies}} 公告 财报'
# 按地区加本地财经网站和公告来源（台港澳的搜索词会自动转成繁体）。没写的地区用默认 sources。
market_sources:
  TW:
    - { type: search, value: '{{companies}} 新闻' }
    - { type: search, value: '{{companies}} 公告 财报' }
    - { type: site, value: money.udn.com }
    - { type: site, value: cnyes.com }
    - { type: site, value: mops.twse.com.tw }
  HK:
    - { type: search, value: '{{companies}} 新闻' }
    - { type: search, value: '{{companies}} 公告 财报' }
    - { type: site, value: hket.com }
    - { type: site, value: hkej.com }
    - { type: site, value: hkexnews.hk }
  MO:
    - { type: search, value: '{{companies}} 新闻' }
    - { type: search, value: '{{companies}} 公告 财报' }
    - { type: site, value: hket.com }
    - { type: site, value: macaodaily.com }
    - { type: site, value: hkexnews.hk }
  SG:
    - { type: search, value: '{{companies}} 新闻' }
    - { type: search, value: '{{companies}} 公告 财报' }
    - { type: site, value: zaobao.com.sg }
    - { type: site, value: businesstimes.com.sg }
    - { type: site, value: straitstimes.com }
  MY:
    - { type: search, value: '{{companies}} 新闻' }
    - { type: search, value: '{{companies}} 公告 财报' }
    - { type: site, value: sinchew.com.my }
    - { type: site, value: enanyang.my }
    - { type: site, value: theedgemalaysia.com }
  US:
    - { type: search, value: '{{companies}} news' }
    - { type: search, value: '{{companies}} earnings SEC filing' }
    - { type: site, value: reuters.com }
    - { type: site, value: cnbc.com }
    - { type: site, value: sec.gov }
default_schedule: { freq: daily, weekdays: [1, 2, 3, 4, 5], time: '08:30', tz: Asia/Shanghai }
default_length: standard
translations:
  en:
    name: Company Watch
    description: Keep an eye on a few companies — news, filings, products and leadership moves
    category: Business
    fields:
      companies: { label: Companies to watch, placeholder: 'e.g. CATL, NVIDIA' }
      aspects:
        label: Focus
        options: [Earnings, Product launches, Funding and M&A, Leadership changes, Regulation and lawsuits]
    sections:
      news: { title: Key news, instruction: 'Major news about {{companies}}, focusing on {{aspects}}' }
      filings: { title: Filings and earnings, instruction: 'Company announcements and earnings, with the key numbers' }
